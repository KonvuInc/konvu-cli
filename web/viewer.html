<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Konvu Inventory</title>
<style>
/* @@TOKENS@@ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: var(--konvu-font);
  font-size: var(--konvu-fs-base);
  color: var(--konvu-ink-body);
  background: var(--konvu-mist-1);
  -webkit-font-smoothing: antialiased;
}

body { display: flex; flex-direction: column; overflow: hidden; }

code, .mono { font-family: var(--konvu-mono); font-size: var(--konvu-fs-sm); }

/* ------------------------------------------------------------------ shell --
 * _auth.module.css: a transparent app background, a persistent left rail that
 * lives OUTSIDE the card, and the page itself in a 16px-radius card. That
 * split is what makes the product read as a shell rather than a page.
 */

body { background: var(--konvu-app-bg); }

header.brand {
  flex: none;
  height: 68px;
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: transparent;
}
header.brand h1 {
  margin: 0;
  font-size: var(--konvu-fs-h2);
  font-weight: 600;
  color: var(--konvu-nav-ink);
  letter-spacing: var(--konvu-nav-tracking);
}
.brand-meta {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-left: auto;
  font-size: var(--konvu-fs-sm);
  color: var(--konvu-ink-muted);
}
.brand-meta b { font-weight: 500; color: var(--konvu-ink-body); }

/* .shellSplit — the rail slot and the card, side by side. */
main {
  flex: 1;
  display: flex;
  flex-direction: row;
  min-height: 0;
  margin: 0 8px 8px 0;
  overflow: hidden;
}

/* --------------------------------------------------------------- the rail --
 * TriageRail.module.css. Authored at the handoff's real pixel sizes.
 */
aside.rail {
  flex: 0 0 var(--konvu-rail-width);
  width: var(--konvu-rail-width);
  box-sizing: border-box;
  height: 100%;
  padding: 10px 12px 12px 16px;
  display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto;
  line-height: normal;
  scrollbar-width: thin;
  scrollbar-color: rgba(45, 18, 102, 0.18) transparent;
}
aside.rail::-webkit-scrollbar { width: 6px; }
aside.rail::-webkit-scrollbar-track { background: transparent; }
aside.rail::-webkit-scrollbar-thumb { background: rgba(45, 18, 102, 0.18); border-radius: 3px; }

/* The rail's own header: its label, and the collapse control pushed right. */
.rail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 0 2px 6px;
}
.rail-header-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--konvu-rail-section-label);
}
.collapse-button {
  width: 22px; height: 22px; margin-right: -2px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 6px; background: transparent;
  color: var(--konvu-rail-well-label); cursor: pointer;
}
.collapse-button:hover {
  background: var(--konvu-rail-well-button-hover);
  color: var(--konvu-rail-ink);
}

/* `.scopeWell` — the scope sitting above the filters, recessed one level. */
.well {
  border-radius: 10px;
  background: var(--konvu-rail-well-bg);
  padding: 6px;
  display: flex; flex-direction: column; gap: 2px;
}
.well-header { display: flex; align-items: center; justify-content: space-between; padding: 0 0 2px 6px; }
.well-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--konvu-rail-well-label);
}

.rail-section { display: flex; flex-direction: column; gap: 3px; }
.rail-section > .section-label {
  padding: 0 8px 2px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--konvu-rail-section-label);
}

/* `.row` */
.rrow {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  width: 100%;
  height: 30px;
  padding: 0 8px;
  border: none;
  border-radius: 7px;
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  font-weight: 400;
  color: var(--konvu-rail-row-text);
  text-align: left;
  cursor: pointer;
}
.rrow:hover { background: var(--konvu-rail-row-hover); }
.rrow.active { background: var(--konvu-rail-row-selected); color: var(--konvu-rail-ink); font-weight: 600; }
.rrow.active:hover { background: var(--konvu-rail-row-selected); }
.rrow.dead, .rrow.dead:hover {
  background: transparent;
  color: var(--konvu-rail-dimmed-label);
  cursor: default;
}
.rrow.dead .count { color: var(--konvu-rail-dimmed-count); }
.rrow:focus-visible { outline: 2px solid var(--konvu-focus); outline-offset: -2px; }

.rrow .rlabel { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.rrow .rname { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rrow .count {
  flex: 0 0 auto;
  font-family: var(--konvu-mono);
  font-size: 11.5px;
  color: var(--konvu-rail-count);
}
.rrow.active .count { color: var(--konvu-rail-count-active); }
.rrow svg { flex: none; }

/* A scope row lifts out of the well in white rather than taking a fill. */
.well .rrow { height: 28px; padding: 0 6px; border-radius: 6px; }
.well .rrow.active, .well .rrow.active:hover {
  background: #fff;
  box-shadow: var(--konvu-rail-well-active-shadow);
}
.well .rrow:not(.active):hover { background: var(--konvu-rail-well-button-hover); }

/* --------------------------------------------------------------- the card --
 * `.railCard`. Carries the surface; `main` carries the geometry.
 */
section.card {
  flex: 1 1 auto;
  min-width: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
  isolation: isolate;
  background: var(--konvu-card-bg);
  border: 1px solid var(--konvu-card-bd);
  border-radius: var(--konvu-card-radius);
  box-shadow: var(--konvu-card-shadow);
}

/* PageHeader.tsx: 62px, a 24px gutter, and a gray[2] hairline. */
.page-header {
  flex: none;
  min-height: var(--konvu-page-header-h);
  padding: 0 var(--konvu-page-gutter);
  border-bottom: 1px solid var(--konvu-page-header-bd);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.page-header .left {
  display: flex; align-items: center; gap: 16px;
  min-width: 0; flex: 1 1 auto;
}
.page-header h2 {
  margin: 0;
  font-size: var(--konvu-fs-h1);
  font-weight: 600;
  color: var(--konvu-ink);
  flex-shrink: 0;
}


/* `.scopeChip` — inert while the rail is open, so the scope stays readable. */
.scope-chip {
  display: inline-flex; align-items: center; gap: 5px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  height: 24px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  font-family: var(--konvu-mono);
  font-size: 12.5px;
  color: var(--konvu-rail-count-active);
  white-space: nowrap;
}

.search-wrap { position: relative; flex: 0 1 280px; min-width: 0; }

.content-scroll { flex: 1; overflow: auto; }

/* TriageTableFooter + InfiniteScrollFooter: a sticky footer on the card's own
 * surface, reporting how much of the table is loaded, with the table's
 * keyboard shortcuts on the right. */
.table-footer {
  flex: none;
  position: sticky; bottom: 0;
  padding: 18px;
  background: var(--konvu-card-bg);
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  transition: box-shadow 0.2s ease;
}
.table-footer.scrolled { box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08); }
.footer-left { display: flex; align-items: center; gap: 12px; }
.footer-count {
  font-family: var(--konvu-mono);
  font-size: var(--konvu-fs-sm);
  color: var(--konvu-ink-faint);
}
.footer-count b { font-weight: 500; color: var(--konvu-purple-9); }
.footer-track {
  width: 120px; height: 4px; border-radius: 2px;
  background: var(--konvu-gray-3); overflow: hidden; flex-shrink: 0;
}
.footer-fill {
  height: 100%; border-radius: 2px;
  background: var(--konvu-nav-active);
  transition: width 200ms ease;
}
.footer-shortcuts { display: flex; align-items: center; gap: 12px; }
.shortcut { display: inline-flex; align-items: center; gap: 5px; font-size: var(--konvu-fs-xs); color: var(--konvu-ink-faint); }
kbd {
  font-family: var(--konvu-mono);
  font-size: 10.5px;
  border: 1px solid var(--konvu-border-strong);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
  background: var(--konvu-mist-0);
  color: var(--konvu-ink-body);
}

/* ----------------------------------------------------------------- table -- */

/* InventoryTable's own geometry: a fixed layout at a 1200px floor, so columns
 * keep their sizes and the scroller takes the overflow. */
table {
  width: 100%;
  min-width: 1200px;
  table-layout: fixed;
  border-collapse: separate;
  border-spacing: 0;
}

/* The header band is the card's own surface, not a tint, and the column title
 * is ordinary 14px text with a caret -- FilterableTableHeader, not a small-caps
 * label. */
thead th {
  position: sticky; top: 0; z-index: 10;
  background: var(--konvu-card-bg);
  text-align: left;
  font-size: var(--konvu-fs-base);
  font-weight: 400;
  letter-spacing: normal;
  text-transform: none;
  color: var(--konvu-gray-8);
  padding: 11px 11px 11px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
thead th:first-child { padding-left: 24px; }
thead th[aria-sort] { color: var(--konvu-purple-7); font-weight: 600; }
thead th .th-inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; width: 100%;
}
thead th .caret { flex: none; color: var(--konvu-gray-5); }
thead th[aria-sort] .caret { color: var(--konvu-purple-7); }

/* Cell metrics from InventoryTable: a 60px row floor, 9px padding with a 24px
 * first-column inset, middle-aligned, on a deepPurple-0 hairline. */
tbody td {
  height: auto;
  min-height: 60px;
  padding: 9px 9px 9px 11px;
  border-bottom: 1px solid var(--konvu-purple-0);
  vertical-align: middle;
  font-size: var(--konvu-fs-sm);
}
tbody td:first-child { padding-left: 24px; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--konvu-table-hover); }
tbody tr[aria-selected="true"] td { background: var(--konvu-mist-2); }
tbody tr:focus-visible {
  outline: 2px solid var(--konvu-focus);
  outline-offset: -2px;
}

/* The product's name cell: 13px, 600, black, truncated. Endpoint groups are
 * additionally capitalised. */
.cell-name {
  color: #000;
  font-weight: 600;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cell-name.cap { text-transform: capitalize; }

/* Counts are monospace, with their unit and any qualifier beneath. */
.num { font-family: var(--konvu-mono); font-size: var(--konvu-fs-sm); color: var(--konvu-gray-7); }
.unit { font-size: var(--konvu-fs-xs); color: var(--konvu-ink-faint); margin-left: 4px; }
.cell-note { font-size: var(--konvu-fs-xs); color: var(--konvu-ink-faint); margin-top: 2px; }
.dash { color: var(--konvu-ink-faint); }

/* Property in a list cell is plain gray text; the accent belongs to a control
 * card, not to a row. */
.plain-prop { font-size: var(--konvu-fs-sm); color: var(--konvu-gray-7); }
.cell-sub {
  font-family: var(--konvu-mono);
  font-size: var(--konvu-fs-xs);
  color: var(--konvu-ink-muted);
  margin-top: 2px;
  word-break: break-all;
}

/* One line per declaration. A 90-character Go symbol wrapping to three lines
 * makes 600 rows unscannable, which is the whole complaint this page answers.
 * The full value is always in the panel and the title attribute. */
td.decl-cell { max-width: 320px; }
td.decl-cell .cell-sub {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  word-break: normal;
  direction: rtl;          /* keep the symbol, elide the leading path */
  text-align: left;
}

/* ----------------------------------------------------------------- chips -- */

/* Presence is a dot plus a label, never a filled pill -- `PresenceTag` in
 * components/mappedAssets/presence.tsx. Matching it is most of why this page
 * reads as the same product. */
.presence { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.presence .label { font-size: var(--konvu-fs-xs); }

.p-present .dot { background: var(--konvu-present); }
.p-partial .dot { background: var(--konvu-partial); }
.p-absent  .dot { background: var(--konvu-absent); }
.p-none    .dot { background: var(--konvu-none); }
.p-present .label { color: var(--konvu-present); }
.p-partial .label { color: var(--konvu-partial); }
.p-absent  .label { color: var(--konvu-absent); }
.p-none    .label { color: var(--konvu-none); }

/* CoverageSummary: present / partial / absent counts, absent always rendered
 * even at zero so a gap never hides behind a missing column. */
.coverage { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
.coverage-item {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--konvu-mono);
  font-size: 11px;
  line-height: 1.2;
  color: var(--konvu-count);
}
.coverage-item.zero { color: var(--konvu-count-zero); }
.coverage-item.emphasis { font-weight: 600; }

/* Asset kind reads as an icon plus a noun, the way `AssetKindIcon` does. */
.kind { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.kind svg { flex: none; color: var(--konvu-purple-5); }
.kind .label {
  font-size: var(--konvu-fs-sm);
  color: var(--konvu-ink-body);
  white-space: nowrap;
}

/* styles.module.css `.method` */
.method {
  flex-shrink: 0;
  min-width: 92px;
  color: var(--konvu-method);
  font-family: var(--konvu-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.3;
  text-transform: uppercase;
}
.route-preview { display: flex; align-items: center; gap: 7px; margin-top: 4px; min-width: 0; }
.route-preview .method { min-width: auto; }
.route-preview .path {
  font-family: var(--konvu-mono);
  font-size: var(--konvu-fs-xs);
  color: var(--konvu-gray-5);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.route-preview .more { font-size: var(--konvu-fs-xs); color: var(--konvu-ink-faint); flex: none; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--konvu-border);
  font-size: var(--konvu-fs-xs);
  font-weight: 500;
  white-space: nowrap;
  color: var(--konvu-ink-muted);
  background: var(--konvu-mist-1);
}
.chip + .chip { margin-left: 4px; }

/* ------------------------------------------------------------- empty row -- */

.empty {
  padding: 48px 24px;
  text-align: center;
  color: var(--konvu-ink-muted);
}
.empty h4 { margin: 0 0 6px; font-size: var(--konvu-fs-h2); color: var(--konvu-ink); font-weight: 600; }
.empty p { margin: 0; font-size: var(--konvu-fs-sm); line-height: 1.6; }

/* ----------------------------------------------------------------- panel -- */

/* ------------------------------------------------------------ side panel --
 * `AssetSidePanel`'s drawer: 48% wide between 460 and 720, inset 12px from the
 * viewport, 14px radius, over a deep-purple scrim, sliding in from the right.
 */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: var(--konvu-purple-8);
  opacity: 0; pointer-events: none;
  transition: opacity 280ms cubic-bezier(0.22, 0.61, 0.36, 1);
}
.scrim.open { opacity: 0.2; pointer-events: auto; }

aside.panel {
  position: fixed; top: 12px; right: 12px; bottom: 12px; z-index: 50;
  width: 48%; min-width: 460px; max-width: 720px;
  display: flex; flex-direction: column; overflow: hidden;
  background: #fff; border-radius: 14px;
  box-shadow: 0 16px 48px rgba(24, 12, 49, 0.18);
  transform: translateX(calc(100% + 24px));
  transition: transform 280ms cubic-bezier(0.22, 0.61, 0.36, 1);
}
aside.panel.open { transform: translateX(0); }

.panel-head { flex: none; position: relative; padding: 18px 20px 8px; }
.panel-title-row { display: flex; align-items: center; gap: 10px; padding-right: 28px; }
.panel-head h2 {
  margin: 0;
  font-size: 18px; font-weight: 600; line-height: 1.25;
  color: var(--konvu-purple-7); text-transform: capitalize;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* The kind badge beside the title: Mantine variant="light" color="deepPurple". */
.kind-badge {
  flex-shrink: 0; padding: 2px 8px; border-radius: 999px;
  background: var(--konvu-purple-0); color: var(--konvu-purple-6);
  font-size: var(--konvu-fs-xs); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.02em;
}
.repo-row {
  display: flex; align-items: center; gap: 7px; margin-top: 10px;
  font-size: 13px; color: var(--konvu-gray-8);
}
.panel-close {
  position: absolute; top: 16px; right: 16px;
  border: 0; background: none; cursor: pointer;
  font-size: 18px; line-height: 1; color: var(--konvu-ink-faint); padding: 4px;
}
.panel-close:hover { color: var(--konvu-ink); }

#panel-chips {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 10px;
}
.fact { display: inline-flex; align-items: center; gap: 6px; }
/* factLabel(): DM Mono, 0.02em, #8A8399. */
.fact-label {
  font-family: var(--konvu-mono); font-size: var(--konvu-fs-xs);
  letter-spacing: 0.02em; color: #8a8399;
}

/* The tab strip's bottom border is the header/content divide. */
.panel-tabs {
  flex: none; display: flex; flex-wrap: nowrap; gap: 26px;
  width: 100%; padding: 0 24px; overflow: hidden;
  border-bottom: 1px solid var(--konvu-border); margin-top: 10px;
}
.ptab {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 0 11px; color: var(--konvu-ink-body);
  font-family: inherit; font-size: 14px; font-weight: 400; line-height: 20px;
  white-space: nowrap; background: transparent; border: 0; border-radius: 0;
  box-shadow: inset 0 -2px transparent;
  transition: color 120ms ease, box-shadow 120ms ease; cursor: pointer;
}
.ptab[data-active] {
  color: var(--konvu-nav-ink); font-weight: 600;
  box-shadow: inset 0 -2px var(--konvu-nav-active);
}
.ptab:not([data-active]):hover {
  color: var(--konvu-nav-ink); box-shadow: inset 0 -2px var(--konvu-border);
}
.ptab:focus-visible { outline: 2px solid var(--konvu-nav-active); outline-offset: 2px; }
.ptab .count {
  padding: 1px 6px; color: var(--konvu-ink-body);
  font-family: var(--konvu-mono); font-size: 11px; font-weight: 400; line-height: 16px;
  background: #f3f1f7; border-radius: 999px;
}

.panel-body { flex: 1; overflow-y: auto; padding: 20px 24px 32px; }

/* SubTable: a rounded card, a tinted header band, hairline-separated grid rows. */
.subtable { overflow: hidden; border: 1px solid var(--konvu-card-border); border-radius: var(--konvu-radius-sub); }
.subtable-header {
  display: grid; align-items: center; padding: 9px 12px;
  background: var(--konvu-card-header); border-bottom: 1px solid var(--konvu-card-border);
  font-size: var(--konvu-fs-xs); font-weight: 500; color: var(--konvu-ink-body);
}
.subtable-row { display: grid; align-items: center; padding: 7px 12px; cursor: pointer; }
.subtable-row + .subtable-row { border-top: 1px solid var(--konvu-hairline); }
.subtable-row:hover { background: var(--konvu-card-header); }
.subtable-row:focus-visible { outline: 2px solid var(--konvu-focus); outline-offset: -2px; }
.subtable-row > * { min-width: 0; }
.subtable-empty { padding: 12px 0; font-size: var(--konvu-fs-sm); color: var(--konvu-ink-faint); }

.st-name { font-weight: 600; font-size: var(--konvu-fs-sm); color: var(--konvu-purple-7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-dim { color: var(--konvu-ink-faint); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--konvu-ink-faint); text-transform: capitalize; }
.chevron { color: var(--konvu-gray-5); flex: none; }

/* ProtectsList: the status split, then the names in two columns. */
.protects-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 28px; }
.protects-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px;
  border: 0; background: none; cursor: pointer; font: inherit; text-align: left; width: 100%;
}
.protects-row:hover { background: #faf9fd; }
.protects-more {
  margin-top: 10px; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: var(--konvu-fs-sm); font-weight: 600;
  color: var(--konvu-purple-6); padding: 0;
}
.protects-more:hover { text-decoration: underline; }

/* SectionCard.tsx: a 14px-radius bordered panel with an 18px/15px header and a
 * 15px deep-purple heading. */
.sec {
  border: 1px solid var(--konvu-card-border);
  border-radius: var(--konvu-radius-card);
  overflow: hidden;
  margin-top: 16px;
}
.sec > h4 {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0;
  padding: 15px 18px;
  font-size: 15px;
  font-weight: 600;
  color: var(--konvu-purple-7);
  text-transform: none;
  letter-spacing: normal;
}
.sec > h4 .badge {

<script id="baseline-data" type="application/json">/* @@BASELINE@@ */</script>
<script>
"use strict";

/* ===========================================================================
 * Konvu inventory viewer.
 *
 * Reads one baseline.json (schema_version 1) inlined above and renders it.
 * No framework, no network, no storage. Everything below is derivation over
 * the artifact -- nothing is asserted that the baseline does not contain.
 * ======================================================================== */

const DATA = JSON.parse(document.getElementById("baseline-data").textContent);

const ASSETS = DATA.assets || [];
const CONTROLS = DATA.controls || [];
const IMPLS = DATA.implementations || [];
const ROUTES = DATA.routes || [];
const OBS_CONTROLS = (DATA.observations && DATA.observations.controls) || [];

const controlById = new Map(CONTROLS.map((c) => [c.id, c]));
const implById = new Map(IMPLS.map((i) => [i.id, i]));

/* ------------------------------------------------------------------ util -- */

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

/* --------------------------------------------------- token -> URL joining --
 *
 * Endpoint assets carry `tokens[]`: literal regex fragments the engine matched
 * on. `routes[]` is a separate collection of literal paths. Joining them is
 * what makes "search for /api/v1/users" find the group that covers it.
 *
 * The join is only sound when a token is specific. A token list frequently
 * ends in a bare catch-all (`@main\.route\(`, `http\.NewRequest\(`) that
 * matches every route in the repo. Attributing all of them to that asset would
 * assert "public home covers /admin", which the baseline does not claim. So a
 * token that resolves to more than BROAD_RATIO of all routes is kept, but
 * marked broad and never counted as coverage.
 */

const BROAD_RATIO = 0.4;
const MAX_ALTERNATIVES = 32;

/**
 * Expand regex alternation groups into concrete strings.
 * `/(a|b|c)` -> `/a`, `/b`, `/c`. Bounded, because a token is attacker-shaped
 * only in the sense that it comes from a generated artifact, but a pathological
 * nest should not hang the page.
 */
function expandAlternations(s) {
  let out = [s];
  for (let depth = 0; depth < 4; depth++) {
    let changed = false;
    const next = [];
    for (const v of out) {
      const m = v.match(/\(([^()]*)\)/);
      if (!m) { next.push(v); continue; }
      changed = true;
      for (const opt of m[1].split("|")) {
        next.push(v.slice(0, m.index) + opt + v.slice(m.index + m[0].length));
      }
    }
    out = next.slice(0, MAX_ALTERNATIVES);
    if (!changed) break;
  }
  return out;
}

/**
 * Pull literal path fragments out of one regex-ish token.
 *
 * Tokens look like `@main\.route\("/(password-reminder|reset-password)`. The
 * useful part is the path literal, which may carry an alternation group and
 * Flask/Django-style `<param>` segments that appear verbatim in `routes[].path`
 * too, so they compare directly.
 */
function literalPaths(token) {
  if (typeof token !== "string" || token.indexOf("/") === -1) return [];
  const plain = token.replace(/\\(.)/g, "$1"); // `\.` -> `.`
  const out = [];
  const re = /\/[A-Za-z0-9_\-./{}<>:*()|]*/g;
  let m;
  while ((m = re.exec(plain)) !== null) {
    for (const variant of expandAlternations(m[0])) {
      // Cut at a regex quantifier and drop a trailing slash, but keep bare "/"
      // -- it is the root route, and it is matched exactly, never as a prefix.
      let frag = variant.replace(/[*?+].*$/, "");
      if (frag.length > 1) frag = frag.replace(/\/+$/, "");
      if (frag === "/" || frag.length > 1) out.push(frag);
    }
  }
  return out;
}

/**
 * Does a route path belong to this literal fragment?
 *
 * Bare "/" matches only the root route. Anything else matches itself or a path
 * beneath it, so `/<project_id>/members` covers `/<project_id>/members/add`.
 */
function routeMatches(routePath, frag) {
  if (!routePath || !frag) return false;
  if (frag === "/") return routePath === "/";
  return routePath === frag || routePath.startsWith(frag + "/") || routePath.startsWith(frag);
}

/**
 * Resolve each asset's URLs once.
 *
 * A token that resolves to more than BROAD_RATIO of all routes is a catch-all:
 * attributing those routes to the asset would assert coverage the baseline does
 * not claim, so they are dropped rather than recorded. A URL the asset declares
 * outright always wins over an inferred one.
 */
function buildUrlsByAsset() {
  const byAsset = new Map();

  for (const a of ASSETS) {
    const urls = new Set();
    const inferred = new Set();

    // Explicit routes[] on the asset are authoritative; no inference needed.
    for (const r of a.routes || []) if (r && r.path) urls.add(r.path);

    for (const tok of a.tokens || []) {
      const frags = literalPaths(tok);
      if (!frags.length) continue;
      const hits = ROUTES.filter((r) => frags.some((f) => routeMatches(r.path, f)));
      if (!hits.length) continue;
      if (ROUTES.length > 0 && hits.length / ROUTES.length > BROAD_RATIO) continue;
      for (const r of hits) inferred.add(r.path);
    }

    for (const u of inferred) urls.add(u);
    if (urls.size) byAsset.set(a.id, Array.from(urls));
  }
  return byAsset;
}

const URLS_BY_ASSET = buildUrlsByAsset();

function assetUrls(a) {
  return URLS_BY_ASSET.get(a.id) || [];
}

/* --- product vocabulary ----------------------------------------------------
 * These four mirror components/mappedAssets/presence.tsx one for one, so a row
 * here reads the same as a row in the dashboard's inventory tables.
 */

/** `AssetKindIcon` — the same lucide glyphs at the same 1.7 stroke weight. */
const KIND_ICON_PATHS = {
  endpoint:
    '<path d="m10.586 5.414-5.172 5.172"/><path d="m18.586 13.414-5.172 5.172"/><path d="M6 12h12"/>' +

  object:
    '<path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/>' +
    '<path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/>' +
    '<path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/>' +
    '<path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/>' +
    '<path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/>' +
    '<path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/>',
  field:
    '<path d="M12 20h-1a2 2 0 0 1-2-2 2 2 0 0 1-2 2H6"/><path d="M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7"/>' +
    '<path d="M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1"/><path d="M6 4h1a2 2 0 0 1 2 2 2 2 0 0 1 2-2h1"/><path d="M9 6v12"/>',
  code:
    '<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/>' +
    '<path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>',
};

/** `assetKindLabels` in presence.tsx. */
const KIND_LABEL = {
  endpoint: "Endpoint group",
  object: "Data object",
  field: "Field",
  code: "Code asset",
};

function kindIcon(kind, size) {
  const paths = KIND_ICON_PATHS[kind];
  if (!paths) return "";
  return (
    `<svg width="${size || 18}" height="${size || 18}" viewBox="0 0 24 24" fill="none" ` +
    `stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
    paths + `</svg>`
  );
}


/** `PresenceTag` — a dot and a capitalised label, never a filled pill. */
function presenceTag(presence) {
  return (
    `<span class="presence p-${presence}"><span class="dot"></span>` +
    `<span class="label">${esc(COV_LABEL[presence] || presence)}</span></span>`
  );
}

/**
 * `CoverageSummary` — present / partial / absent counts. Absent is always
 * rendered, even at zero, so a gap never hides behind a missing column.
 */
function coverageSummary(counts, label) {
  const title =
    (label ? label + ": " : "") +
    `${counts.present} present, ${counts.partial} partial, ${counts.absent} absent`;
  const items = ["present", "partial", "absent"]
    .map((p) => {
      const n = counts[p] || 0;
      const emphasis = p === "absent" && n > 0 ? " emphasis" : "";
      return (
        `<span class="coverage-item${n === 0 ? " zero" : ""}${emphasis}">` +
        `<span class="dot p-${p}" style="background:var(--konvu-${p})"></span>${n}</span>`
      );
    })
    .join("");
  return `<span class="coverage" title="${esc(title)}" aria-label="${esc(title)}">${items}</span>`;
}


/** The radix carets `FilterableTableHeader` renders in a column title. */
const CARETS = {
  none:
    '<path fill-rule="evenodd" clip-rule="evenodd" d="M4.93179 5.43179C4.75605 5.60753 4.75605 5.89245 4.93179 6.06819C5.10753 6.24392 5.39245 6.24392 5.56819 6.06819L7.49999 4.13638L9.43179 6.06819C9.60753 6.24392 9.89245 6.24392 10.0682 6.06819C10.2439 5.89245 10.2439 5.60753 10.0682 5.43179L7.81819 3.18179C7.73379 3.0974 7.61933 3.04999 7.49999 3.04999C7.38064 3.04999 7.26618 3.0974 7.18179 3.18179L4.93179 5.43179ZM10.0682 9.56819C10.2439 9.39245 10.2439 9.10753 10.0682 8.93179C9.89245 8.75606 9.60753 8.75606 9.43179 8.93179L7.49999 10.8636L5.56819 8.93179C5.39245 8.75606 5.10753 8.75606 4.93179 8.93179C4.75605 9.10753 4.75605 9.39245 4.93179 9.56819L7.18179 11.8182C7.35753 11.9939 7.64245 11.9939 7.81819 11.8182L10.0682 9.56819Z"/>',
  asc:
    '<path fill-rule="evenodd" clip-rule="evenodd" d="M4.18179 8.81819C4.00605 8.64245 4.00605 8.35753 4.18179 8.18179L7.18179 5.18179C7.26618 5.0974 7.38064 5.04999 7.49999 5.04999C7.61933 5.04999 7.73379 5.0974 7.81819 5.18179L10.8182 8.18179C10.9939 8.35753 10.9939 8.64245 10.8182 8.81819C10.6424 8.99392 10.3575 8.99392 10.1818 8.81819L7.49999 6.13638L4.81819 8.81819C4.64245 8.99392 4.35753 8.99392 4.18179 8.81819Z"/>',
  desc:
    '<path fill-rule="evenodd" clip-rule="evenodd" d="M4.18179 6.18181C4.35753 6.00608 4.64245 6.00608 4.81819 6.18181L7.49999 8.86362L10.1818 6.18181C10.3575 6.00608 10.6424 6.00608 10.8182 6.18181C10.9939 6.35755 10.9939 6.64247 10.8182 6.81821L7.81819 9.81821C7.73379 9.9026 7.61934 9.95001 7.49999 9.95001C7.38064 9.95001 7.26618 9.9026 7.18179 9.81821L4.18179 6.81821C4.00605 6.64247 4.00605 6.35755 4.18179 6.18181Z"/>',
};

function caret(kind) {
  return (
    `<svg class="caret" width="15" height="15" viewBox="0 0 15 15" fill="currentColor" ` +
    `aria-hidden="true">${CARETS[kind]}</svg>`
  );
}

/** `propertyLabel` in data.ts. */
function propertyLabel(property) {
  if (!property) return "";
  if (property === "non_repudiation") return "Non-repudiation";
  return property.charAt(0).toUpperCase() + property.slice(1);
}


/** `RoutePreview` — the first route of a group, with a count of the rest. */
function routePreview(urls, method) {
  if (!urls.length) return "";
  return (
    `<span class="route-preview"><span class="method">${esc(method || "route")}</span>` +
    `<span class="path">${esc(urls[0])}</span>` +
    (urls.length > 1 ? `<span class="more">+${urls.length - 1}</span>` : "") +
    `</span>`
  );
}



/**
 * The left rail, as `InventoryAssetRail` renders it: a "Filters" header with a
 * collapse control, and one "Asset type" section of plain rows. No counts, no
 * icons and no filter sections -- the product has none of them here.
 */
function renderRail() {
  const rows = VIEWS.map(
    (v) =>
      `<button class="rrow${state.view === v.value ? " active" : ""}" data-nav="${v.value}"` +
      ` aria-pressed="${state.view === v.value}" type="button">` +
      `<span class="rlabel"><span class="rname">${esc(v.label)}</span></span></button>`
  ).join("");

  document.getElementById("rail").innerHTML =
    `<div class="rail-header"><span class="rail-header-label">Filters</span>` +
    `<button class="collapse-button" id="rail-collapse" aria-label="Collapse filters" ` +
    `title="Collapse filters" type="button">` +
    `<svg width="14" height="14" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true">` +
    `<path fill-rule="evenodd" d="M8.84 3.135a.5.5 0 0 1 .025.707L6.436 6.5l2.429 2.658a.5.5 0 1 1-.732.677l-2.75-3a.5.5 0 0 1 0-.677l2.75-3a.5.5 0 0 1 .707-.023Z"/>` +
    `<path fill-rule="evenodd" d="M5.34 3.135a.5.5 0 0 1 .025.707L2.936 6.5l2.429 2.658a.5.5 0 1 1-.732.677l-2.75-3a.5.5 0 0 1 0-.677l2.75-3a.5.5 0 0 1 .707-.023Z"/>` +
    `</svg></button></div>` +
    `<div class="rail-section"><div class="section-label">Asset type</div>${rows}</div>`;

/* ------------------------------------------------------------ derivation -- */

const RANK = { absent: 0, partial: 1, present: 2 };

/** An unrecognised status is treated as partial: recorded, but not trusted. */
function normStatus(status) {
  return RANK[status] === undefined ? "partial" : status;
}

function statusesOf(asset) {
  return (asset.controls || []).map((l) => l.status);
}

/** The weakest status in a set. */
function worstOf(statuses) {
  let worst = "present";
  for (const st of statuses) {
    const v = normStatus(st);
    if (RANK[v] < RANK[worst]) worst = v;
  }
  return worst;
}

/** `coverageOf` — present / partial / absent counts over a control's statuses. */
function coverageOf(statuses) {
  const c = { present: 0, partial: 0, absent: 0, total: statuses.length };
  for (const st of statuses) c[normStatus(st)]++;
  return c;
}

/** Sorting a coverage cell by its gaps is what a reviewer actually wants. */
function byGaps(c) {
  return c.absent * 1000 + c.partial;
}

/* --- indexes ---------------------------------------------------------------
 * Every lookup the render path needs, built once. Without these the object view
 * is O(objects x assets): `childFields` alone scanned all assets per object,
 * which measured 27x slower than the bucketed form at customer scale.
 */

const VERSION_SUFFIX = /_version$/;

/**
 * The identifier to pair a version table with its model.
 *
 * data.ts matches on `name`, because the hosted graph names an object after its
 * table. This artifact names it for a human -- "Bill version history" declared
 * at `...#bill_version` -- so matching on `name` alone pairs nothing and the
 * Version tables column is dead in every row. Prefer the declared symbol and
 * fall back to the name, which reproduces the product's behaviour on both
 * naming conventions.
 */
function objectKey(asset) {
  const decl = asset.decl || "";
  const symbol = decl.includes("#") ? decl.slice(decl.lastIndexOf("#") + 1) : "";
  return (symbol || asset.name || "").toLowerCase();
}

function isVersionTable(asset) {
  return VERSION_SUFFIX.test(objectKey(asset)) || VERSION_SUFFIX.test(asset.name);
}

const FIELDS_BY_PARENT = new Map();
for (const a of ASSETS) {
  if (a.kind !== "field" || !a.parent) continue;
  if (!FIELDS_BY_PARENT.has(a.parent)) FIELDS_BY_PARENT.set(a.parent, []);
  FIELDS_BY_PARENT.get(a.parent).push(a);
}

function childFields(objectId) {
  return FIELDS_BY_PARENT.get(objectId) || [];
}

/** Every asset link to a control, bucketed by control id. */
const LINKS_BY_CONTROL = new Map();
for (const a of ASSETS) {
  for (const l of a.controls || []) {
    if (!LINKS_BY_CONTROL.has(l.control_id)) LINKS_BY_CONTROL.set(l.control_id, []);
    LINKS_BY_CONTROL.get(l.control_id).push({ asset: a, link: l });
  }
}

function linksForControl(controlId) {
  return LINKS_BY_CONTROL.get(controlId) || [];
}

/** Implementations, bucketed by the observation ids a control names. */
const IMPLS_BY_OBSERVATION = new Map();
for (const im of IMPLS) {
  for (const id of im.source_control_observation_ids || []) {
    if (!IMPLS_BY_OBSERVATION.has(id)) IMPLS_BY_OBSERVATION.set(id, []);
    IMPLS_BY_OBSERVATION.get(id).push(im);
  }
}

/**
 * `implementedControls` — controls with at least one implementation in the
 * code. A control nothing implements is an expectation the code fails, which is
 * a finding rather than an asset, so the product deliberately omits it here.
 */
function implementationsFor(control) {
  const seen = new Set();
  const out = [];
  for (const id of control.source_control_observation_ids || []) {
    for (const im of IMPLS_BY_OBSERVATION.get(id) || []) {
      if (seen.has(im.id)) continue;
      seen.add(im.id);
      out.push(im);
    }
  }
  return out;
}

const PROPERTY_ORDER = [
  "authorization",
  "authentication",
  "confidentiality",
  "integrity",
  "availability",
  "non_repudiation",
];

const IMPLEMENTED_CONTROLS = CONTROLS.filter((c) => implementationsFor(c).length > 0).sort(
  (a, b) => {
    const byProp = PROPERTY_ORDER.indexOf(a.property) - PROPERTY_ORDER.indexOf(b.property);
    return byProp !== 0 ? byProp : (a.name || "").localeCompare(b.name || "");
  }
);

/**
 * `controlPresence` — repository-wide presence for one control. Absent when
 * nothing implements it; partial when it is implemented but covers nothing,
 * since the mapping shows no asset it demonstrably protects; otherwise the
 * weakest status recorded across the assets it covers.
 */
function controlPresence(statuses, control) {
  if (implementationsFor(control).length === 0) return "absent";
  if (statuses.length === 0) return "partial";
  return worstOf(statuses);
}

/* --- data-object grouping, ported from data.ts -----------------------------
 * A data object is a model plus the version/audit tables generated for it and
 * the fields it owns. The product groups them this way, and its coverage cell
 * rolls up the model's own control links together with every field's, so a
 * classified field is never invisible behind an unclassified model.
 */
function buildDataObjectGroups() {
  const objects = ASSETS.filter((a) => a.kind === "object");
  const versionTables = objects.filter(isVersionTable);
  const models = objects.filter((o) => !isVersionTable(o));

  const shadowsByKey = new Map();
  for (const t of versionTables) {
    const key = objectKey(t).replace(VERSION_SUFFIX, "");
    if (!shadowsByKey.has(key)) shadowsByKey.set(key, []);
    shadowsByKey.get(key).push(t);
  }

  const groups = models.map((model) => {
    const shadows = shadowsByKey.get(objectKey(model)) || [];
    const fields = childFields(model.id);
    return {
      model,
      versionTables: shadows,
      fields,
      classifiedFields: fields.filter((f) => (f.controls || []).length > 0),
    };
  });

  // A version table with no matching model still gets a row, so no object in
  // the repository goes unlisted.
  const paired = new Set(groups.flatMap((g) => g.versionTables.map((t) => t.id)));
  for (const orphan of versionTables.filter((t) => !paired.has(t.id))) {
    groups.push({ model: orphan, versionTables: [], fields: [], classifiedFields: [] });
  }
  return groups;
}

const DATA_OBJECT_GROUPS = buildDataObjectGroups();
const GROUP_BY_MODEL_ID = new Map(DATA_OBJECT_GROUPS.map((g) => [g.model.id, g]));

/* --- rows ------------------------------------------------------------------
 * One row builder per asset type, each producing rows that carry everything the
 * table and the panel need. A row's identity never depends on which view is on
 * screen: opening a data object from a Relations tab must give the same group,
 * and the same coverage, as opening it from the Data objects table.
 */

function searchText(parts) {
  return parts.filter(Boolean).join(" ").toLowerCase();
}

function assetRow(a) {
  const urls = assetUrls(a);
  return {
    id: a.id,
    asset: a,
    counts: coverageOf(statusesOf(a)),
    urls,
    haystack: searchText([
      a.name,
      a.decl,
      a.description,
      (a.paths || []).join(" "),
      urls.join(" "),
      (a.controls || [])
        .map((l) => (controlById.get(l.control_id) || {}).name || l.control_id)
        .join(" "),
    ]),
  };
}

function groupRow(group) {
  const statuses = [
    ...statusesOf(group.model),
    ...group.fields.flatMap((f) => statusesOf(f)),
  ];
  return {
    id: group.model.id,
    asset: group.model,
    group,
    counts: coverageOf(statuses),
    urls: assetUrls(group.model),
    haystack: searchText([
      group.model.name,
      group.model.decl,
      group.model.description,
      group.fields.map((f) => f.name).join(" "),
      group.versionTables.map((t) => t.name).join(" "),
    ]),
  };
}

function controlRow(c) {
  const links = linksForControl(c.id);
  const statuses = links.map(({ link }) => link.status);
  return {
    id: c.id,
    c,
    links,
    presence: controlPresence(statuses, c),
    counts: coverageOf(statuses),
    haystack: searchText([c.name, c.id, c.description, c.property]),
  };
}

const ENDPOINT_ROWS = ASSETS.filter((a) => a.kind === "endpoint").map(assetRow);
const OBJECT_ROWS = DATA_OBJECT_GROUPS.map(groupRow);
const CONTROL_ROWS = IMPLEMENTED_CONTROLS.map(controlRow);

/**
 * Every row that can be opened, by id, whatever view produced it. This is what
 * keeps a data object's group identity when it is reached from a Relations tab
 * or a Protects list rather than from its own table.
 */
const ROW_BY_ID = new Map();
for (const r of [...OBJECT_ROWS, ...ENDPOINT_ROWS, ...CONTROL_ROWS]) ROW_BY_ID.set(r.id, r);
// Every remaining asset is openable too -- fields and code assets are reached
// through a panel, never through a table of their own.
for (const a of ASSETS) if (!ROW_BY_ID.has(a.id)) ROW_BY_ID.set(a.id, assetRow(a));

function rowById(id) {
  return ROW_BY_ID.get(id) || null;
}

/**
 * `SectionCard` — a 14px-radius bordered panel with a 15px deep-purple heading
 * and an optional count badge. The panel is built from these so it reads like
 * the repository overview rather than a stack of loose headings.
 */
function section(title, body, badge) {
  if (!body) return "";
  return (
    `<div class="sec"><h4>${esc(title)}` +
    (badge != null ? `<span class="badge">${esc(badge)}</span>` : "") +
    `</h4><div class="sec-body">${body}</div></div>`
  );
}

/** `presenceLabel` in data.ts: the presence, capitalised. There are three. */
const COV_LABEL = { present: "Present", partial: "Partial", absent: "Absent" };

/* ------------------------------------------------------------------ state -- */

/**
 * The asset types, exactly as `SECURITY_GRAPH_ASSET_TYPES` lists them. Each
 * carries its own rows, columns and open action, so adding a type is one entry
 * here rather than an edit to four switches that fail silently when missed.
 */
const VIEWS = [
  {
    value: "endpoint",
    label: "Endpoints",
    kind: "endpoint",
    itemLabel: "endpoint groups",
    rows: () => ENDPOINT_ROWS,
    open: openAsset,
    defaultSort: { key: "coverage", dir: -1 },
    columns: [
      {
        key: "endpoint", label: "Endpoint group", width: "auto",
        value: (r) => (r.asset.name || "").toLowerCase(),
        cell: (r) =>
          `<div class="cell-name cap">${esc(r.asset.name)}</div>` +
          routePreview(r.urls, (r.asset.routes && r.asset.routes[0] && r.asset.routes[0].method) || "route"),
      },
      {
        key: "routes", label: "Endpoints", width: "110px",
        value: (r) => r.urls.length,
        cell: (r) => `<span class="num">${r.urls.length}</span>`,
      },
      {
        key: "coverage", label: "Control coverage", width: "220px",
        value: (r) => byGaps(r.counts),
        cell: (r) => coverageSummary(r.counts, r.asset.name),
      },
    ],
  },
  {
    value: "object",
    label: "Data objects",
    kind: "object",
    itemLabel: "data objects",
    rows: () => OBJECT_ROWS,
    open: openAsset,
    defaultSort: { key: "coverage", dir: -1 },
    columns: [
      {
        key: "model", label: "Data object", width: "auto",
        value: (r) => (r.asset.name || "").toLowerCase(),
        cell: (r) =>
          `<div class="cell-name">${esc(r.asset.name)}</div>` +
          `<div class="cell-sub" title="${esc(r.asset.decl || "")}">${esc(r.asset.decl || "")}</div>`,
      },
      {
        key: "fields", label: "Fields", width: "170px",
        value: (r) => r.group.fields.length,
        cell: (r) =>
          `<span class="num">${r.group.fields.length}</span>` +
          `<div class="cell-note">${r.group.classifiedFields.length} carrying controls</div>`,
      },
      {
        key: "versions", label: "Version tables", width: "140px",
        value: (r) => r.group.versionTables.length,
        cell: (r) =>
          r.group.versionTables.length
            ? `<span class="num" title="${esc(r.group.versionTables.map((t) => t.name).join(", "))}">${r.group.versionTables.length}</span>`
            : `<span class="dash">—</span>`,
      },
      {
        key: "coverage", label: "Control coverage", width: "220px",
        value: (r) => byGaps(r.counts),
        cell: (r) => coverageSummary(r.counts, r.asset.name),
      },
    ],
  },
  {
    value: "controls",
    label: "Controls",
    itemLabel: "controls",
    rows: () => CONTROL_ROWS,
    open: openControl,
    // Partial first: the product sorts status ascending so the weakest reads
    // at the top.
    defaultSort: { key: "status", dir: 1 },
    columns: [
      {
        key: "control", label: "Control", width: "auto",
        value: (r) => (r.c.name || r.c.id).toLowerCase(),
        cell: (r) =>
          `<div class="cell-name">${esc(r.c.name || r.c.id)}</div>` +
          `<div class="cell-sub" title="${esc(r.c.id)}">${esc(r.c.id)}</div>`,
      },
      {
        key: "property", label: "Property", width: "150px",
        value: (r) => PROPERTY_ORDER.indexOf(r.c.property),
        // Plain gray text, not an accent: the accent belongs to a control
        // card, not to a cell in a list.
        cell: (r) => `<span class="plain-prop">${esc(propertyLabel(r.c.property))}</span>`,
      },
      {
        key: "status", label: "Status", width: "120px",
        value: (r) => (r.presence === "partial" ? 0 : 1),
        cell: (r) => presenceTag(r.presence),
      },
      {
        key: "protects", label: "Protects", width: "140px",
        value: (r) => r.links.length,
        cell: (r) =>
          `<span class="num">${r.links.length}</span>` +
          `<span class="unit">${r.links.length === 1 ? "asset" : "assets"}</span>`,
      },
    ],
  },
];

const state = {
  view: "endpoint",
  q: "",
  /** `null` means "whatever this table's default is" — see the view's spec. */
  sort: { key: null, dir: 1 },
  selected: null,
  cursor: -1,
};

function viewOf(value) {
  return VIEWS.find((v) => v.value === (value || state.view)) || VIEWS[0];
}

function viewCount(v) {
  return v.rows().length;
}

/* ------------------------------------------------------------- rendering -- */

/** Search and sort, applied to whatever the current view's rows are. */
function filtered() {
  const spec = viewOf();
  const all = spec.rows();
  const q = state.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];

  const rows = terms.length
    ? all.filter((r) => terms.every((t) => r.haystack.indexOf(t) !== -1))
    : all.slice();

  const sort = state.sort.key ? state.sort : spec.defaultSort;
  const col = spec.columns.find((c) => c.key === sort.key) || spec.columns[0];
  rows.sort((x, y) => {
    const a = col.value(x), b = col.value(y);
    if (a < b) return -1 * sort.dir;
    if (a > b) return 1 * sort.dir;
    return 0;
  });
  return { rows, total: all.length, spec, sort };
}

function renderTable() {
  const { rows, total, spec, sort } = filtered();

  document.getElementById("thead").innerHTML =
    "<tr>" +
    spec.columns
      .map((c) => {
        const active = sort.key === c.key;
        const kind = active ? (sort.dir > 0 ? "asc" : "desc") : "none";
        const w = c.width === "auto" ? "" : ` style="width:${c.width}"`;
        const title = active
          ? sort.dir > 0
            ? "Sort descending"
            : "Clear sort"
          : "Sort ascending";
        return (
          `<th data-key="${c.key}"${w}${active ? ` aria-sort="${kind}ending"` : ""} title="${title}">` +
          `<span class="th-inner"><span>${esc(c.label)}</span>${caret(kind)}</span></th>`
        );
      })
      .join("") +
    "</tr>";

  const count = document.getElementById("footer-count");
  count.innerHTML = `<b>${rows.length}</b> of ${total} ${esc(spec.itemLabel)} loaded`;
  document.getElementById("footer-fill").style.width =
    (total > 0 ? Math.min(1, rows.length / total) * 100 : 0) + "%";

  const empty = document.getElementById("empty");
  const tbody = document.getElementById("tbody");

  if (!rows.length) {
    tbody.innerHTML = "";
    empty.style.display = "";
    empty.innerHTML =
      `<h4>Nothing matches</h4><p>No ${esc(spec.itemLabel)} match this search.</p>`;
    return;
  }
  empty.style.display = "none";

  tbody.innerHTML = rows
    .map(
      (r, i) =>
        `<tr data-i="${i}" data-id="${esc(r.id)}" tabindex="-1" aria-selected="${state.selected === r.id}">` +
        spec.columns.map((c) => `<td class="col-${c.key}">${c.cell(r)}</td>`).join("") +
        `</tr>`
    )
    .join("");
}

/* --- the side panel -------------------------------------------------------
 * `AssetPanel` and `ControlPanel`: a header naming what this is and where it
 * came from, a tab strip, and one tab body at a time. Assets get Overview,
 * Relations and Controls; a control gets Overview and Protects.
 */

const panelState = { node: null, tab: "overview", expandedProtects: false };

/** `SubTable` — a rounded card, a tinted header band, hairline grid rows. */
function subTable(columns, rows, emptyMessage) {
  if (!rows.length) {
    return `<p class="subtable-empty">${esc(emptyMessage || "Nothing to show.")}</p>`;
  }
  const grid = columns.map((c) => c.width).join(" ");
  return (
    `<div class="subtable">` +
    `<div class="subtable-header" style="grid-template-columns:${grid}">` +
    columns.map((c) => `<span>${esc(c.label || "")}</span>`).join("") +
    `</div>` +
    rows
      .map(
        (r) =>
          `<div class="subtable-row" style="grid-template-columns:${grid}"` +
          (r.open ? ` role="button" tabindex="0" data-open="${esc(r.open)}"` : "") +
          `>` +
          columns.map((c) => `<div>${r.cells[c.key] || ""}</div>`).join("") +
          `</div>`
      )
      .join("") +
    `</div>`
  );
}

const CHEVRON =
  '<svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' +
  'aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';

const GITHUB_ICON =
  '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
  '<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 ' +
  '0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 ' +
  '1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 ' +
  '0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 ' +
  '2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 ' +
  '0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>';

/** `assetRelations` — what this asset relates to, named for its kind. */
function assetRelations(asset, group) {
  if (asset.kind === "endpoint") {
    const controlIds = new Set((asset.controls || []).map((l) => l.control_id));
    return {
      label: "Data objects",
      assets: ASSETS.filter(
        (o) => o.kind === "object" && (o.controls || []).some((l) => controlIds.has(l.control_id))
      ),
    };
  }
  if (asset.kind === "object") {
    const fields = group ? group.fields : childFields(asset.id);
    return {
      label: "Fields",
      // Fields carrying controls first: those are the ones worth reviewing.
      assets: [...fields].sort((a, b) => (b.controls || []).length - (a.controls || []).length),
    };
  }
  return { label: "Related", assets: [] };
}

function openAsset(id) {
  if (!rowById(id)) return;
  panelState.node = { kind: "asset", id };
  panelState.tab = "overview";
  panelState.expandedProtects = false;
  state.selected = id;
  renderPanel();
}

function openControl(id) {
  if (!controlById.get(id)) return;
  panelState.node = { kind: "control", id };
  panelState.tab = "overview";
  panelState.expandedProtects = false;
  state.selected = id;
  renderPanel();
}

function renderPanel() {
  const node = panelState.node;
  if (!node) return;
  if (node.kind === "control") renderControlPanel(controlById.get(node.id));
  else renderAssetPanel(node.id);

  document.getElementById("panel").classList.add("open");
  document.getElementById("scrim").classList.add("open");
  markSelected();
}

function tabStrip(tabs) {
  return tabs
    .map(
      (t) =>
        `<button class="ptab" data-tab="${t.value}" role="tab"` +
        (panelState.tab === t.value ? " data-active" : "") +
        `>${esc(t.label)}` +
        (t.count ? `<span class="count" aria-hidden="true">${t.count}</span>` : "") +
        `</button>`
    )
    .join("");
}

function panelHeader(title, kindLabel, facts) {
  document.getElementById("panel-title").textContent = title;
  document.getElementById("panel-kind").textContent = kindLabel;
  document.getElementById("panel-repo").innerHTML =
    GITHUB_ICON + `<span>${esc((DATA.codebase || {}).name || "")}</span>`;
  document.getElementById("panel-chips").innerHTML = facts.join("");
}

function renderAssetPanel(id) {
  const row = rowById(id);
  if (!row) return;
  const a = row.asset || row.group.model;
  const group = row.group;
  const urls = row.urls || assetUrls(a);
  const relations = assetRelations(a, group);

  const facts = [];
  if (row.counts.total > 0) {
    facts.push(
      `<span class="fact"><span class="fact-label">CONTROLS</span>` +
        coverageSummary(row.counts, a.name) + `</span>`
    );
  }
  if (a.kind === "endpoint") {
    facts.push(
      `<span class="fact"><span class="fact-label">ENDPOINTS</span>` +
        `<span class="num">${urls.length}</span></span>`
    );
  }
  panelHeader(a.name, KIND_LABEL[a.kind] || a.kind, facts);

  const links = group
    ? [...(group.model.controls || []), ...group.fields.flatMap((f) => f.controls || [])]
    : a.controls || [];

  document.getElementById("panel-tabs").innerHTML = tabStrip([
    { value: "overview", label: "Overview" },
    ...(relations.assets.length
      ? [{ value: "relations", label: relations.label, count: relations.assets.length }]
      : []),
    { value: "controls", label: "Controls", count: links.length || 0 },
  ]);

  const body = document.getElementById("panel-body");

  if (panelState.tab === "relations") {
    body.innerHTML = relationsTable(a, relations);
    return;
  }
  if (panelState.tab === "controls") {
    body.innerHTML = controlsTable(links, a);
    return;
  }

  // Overview — `AssetOverview`.
  const kindNoun = a.kind === "endpoint" ? "endpoint group" : a.kind;
  const parts = [
    `<p class="overview-lede">This overview profiles the ${esc(kindNoun)} Konvu found when it ` +
      `mapped ${esc((DATA.codebase || {}).name || "this repository")}.</p>`,
    section(
      "What it is",
      `<div class="hair"><p class="prose">${esc(a.description || "")}</p>` +
        `<p class="location">${esc(a.decl || "")}</p></div>`
    ),
  ];

  if (a.kind === "endpoint" && urls.length) {
    parts.push(
      section(
        "Endpoints",
        urls
          .map(
            (u) =>
              `<div class="route-row"><span class="method">route</span>` +
              `<span class="mono">${esc(u)}</span></div>`
          )
          .join(""),
        urls.length
      )
    );
  }

  if (group && group.versionTables.length) {
    parts.push(
      section(
        "Version tables",
        group.versionTables
          .map((t) => `<div class="route-row"><span class="mono">${esc(t.name)}</span></div>`)
          .join(""),
        group.versionTables.length
      )
    );
  }

  body.innerHTML = parts.join("");
}

function relationsTable(asset, relations) {
  const isEndpoint = asset.kind === "endpoint";
  const columns = [
    { key: "asset", label: relations.label.replace(/s$/, ""), width: "minmax(0, 1fr)" },
    { key: "count", label: isEndpoint ? "Fields" : "Controls", width: "80px" },
    { key: "coverage", label: "Coverage", width: "150px" },
    { key: "open", label: "", width: "20px" },
  ];
  const rows = relations.assets.map((related) => {
    const counts = coverageOf((related.controls || []).map((l) => l.status));
    const n = isEndpoint ? childFields(related.id).length : (related.controls || []).length;
    return {
      open: related.id,
      cells: {
        asset:
          `<span class="kind">${kindIcon(related.kind, 16)}` +
          `<span class="st-name">${esc(related.name)}</span></span>`,
        count: `<span class="num">${n}</span>`,
        coverage: coverageSummary(counts, related.name),
        open: CHEVRON,
      },
    };
  });
  return subTable(columns, rows, "Nothing related.");
}

function controlsTable(links, asset) {
  const columns = [
    { key: "control", label: "Control", width: "minmax(0, 1fr)" },
    { key: "property", label: "Property", width: "120px" },
    { key: "status", label: "Status", width: "96px" },
    { key: "open", label: "", width: "20px" },
  ];
  // Property order first, then name, so it reads like a coverage checklist.
  const sorted = [...links].sort((l, r) => {
    const lc = controlById.get(l.control_id) || {};
    const rc = controlById.get(r.control_id) || {};
    const byProp = PROPERTY_ORDER.indexOf(lc.property) - PROPERTY_ORDER.indexOf(rc.property);
    return byProp !== 0 ? byProp : (lc.name || "").localeCompare(rc.name || "");
  });
  const rows = sorted.map((l) => {
    const c = controlById.get(l.control_id) || {};
    return {
      open: l.control_id,
      cells: {
        control: `<span class="st-name">${esc(c.name || l.control_id)}</span>`,
        property: `<span class="st-dim">${esc(propertyLabel(c.property))}</span>`,
        status:
          `<span class="st-status"><span class="dot" style="background:var(--konvu-${
            RANK[l.status] === undefined ? "absent" : l.status
          })"></span>${esc(l.status || "")}</span>`,
        open: CHEVRON,
      },
    };
  });
  const label = asset.kind === "endpoint" ? "endpoint group" : asset.kind;
  return subTable(columns, rows, `No controls detected on this ${label}.`);
}

/** How many protected assets to show before the rest go behind a toggle. */
const ASSET_CAP = 6;

function renderControlPanel(c) {
  if (!c) return;
  const covered = [];
  for (const a of ASSETS) {
    for (const l of a.controls || []) if (l.control_id === c.id) covered.push({ a, l });
  }
  const impls = implementationsFor(c);

  panelHeader(c.name || c.id, "Control", [
    `<span class="fact"><span class="fact-label">PROPERTY</span>` +
      `<span class="st-dim">${esc(propertyLabel(c.property))}</span></span>`,
    `<span class="fact"><span class="fact-label">STATUS</span>` +
      presenceTag(controlPresence(covered.map(({ l }) => l.status), c)) + `</span>`,
  ]);

  document.getElementById("panel-tabs").innerHTML = tabStrip([
    { value: "overview", label: "Overview" },
    { value: "protects", label: "Protects", count: covered.length || 0 },
  ]);

  const body = document.getElementById("panel-body");

  if (panelState.tab === "protects") {
    if (!covered.length) {
      body.innerHTML =
        `<p class="subtable-empty">This control is not linked to any asset in the repository.</p>`;
      return;
    }
    const shown = panelState.expandedProtects ? covered : covered.slice(0, ASSET_CAP);
    body.innerHTML =
      `<div class="protects-grid">` +
      shown
        .map(
          ({ a, l }) =>
            `<button class="protects-row" data-open-asset="${esc(a.id)}" type="button">` +
            `<span class="dot" style="background:var(--konvu-${
              RANK[l.status] === undefined ? "absent" : l.status
            })"></span>` +
            `<span class="st-name">${esc(a.name)}</span></button>`
        )
        .join("") +
      `</div>` +
      (covered.length > ASSET_CAP
        ? `<button class="protects-more" id="protects-more" type="button">` +
          (panelState.expandedProtects
            ? "Show fewer"
            : `Show all ${covered.length}`) +
          `</button>`
        : "");
    return;
  }

  body.innerHTML = [
    section("What it is", `<div class="hair"><p class="prose">${esc(c.description || "")}</p></div>`),
    section(
      "Implementations",
      impls.length
        ? impls
            .map(
              (im) =>
                `<div class="card" data-property="${esc(c.property || "")}"><div class="card-head">` +
                `<span class="title">${esc(im.name || im.id)}</span></div><div class="card-body">` +
                (im.description ? `<p class="prose">${esc(im.description)}</p>` : "") +
                (im.anchors || [])
                  .map(
                    (an) =>
                      (an.decl ? `<div class="decl">${esc(an.decl)}</div>` : "") +
                      (an.quote ? `<pre class="quote">${esc(an.quote)}</pre>` : "")
                  )
                  .join("") +
                `</div></div>`
            )
            .join("")
        : `<p class="subtable-empty">Nothing in the code implements this control.</p>`,
      impls.length || undefined
    ),
  ].join("");
}

/* Highlight the open row without re-rendering the table: a full render at 600
 * rows throws away scroll position and the row you just clicked jumps away. */
function markSelected() {
  for (const tr of document.querySelectorAll("tbody tr")) {
    const id = tr.dataset.id;
    if (id && id === state.selected) tr.setAttribute("aria-selected", "true");
    else tr.removeAttribute("aria-selected");
  }
}

function closePanel() {
  document.getElementById("panel").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
  panelState.node = null;
  state.selected = null;
  markSelected();
}

/** Route a row to its panel: controls have their own, everything else is an asset. */
function openRow(id) {
  viewOf().open(id);
}


/* ------------------------------------------------------------------ wire -- */

function render() {
  renderTable();
}

function setView(v) {
  state.view = v;
  state.cursor = -1;
  state.sort = { key: null, dir: 1 };
  closePanelSilently();
  renderRail();
  render();
}

function closePanelSilently() {
  document.getElementById("panel").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
  panelState.node = null;
  state.selected = null;
}

/** `InventoryScopeChip` — what this inventory is scoped to. */
function renderScopeChip() {
  const cb = DATA.codebase || {};
  document.title = (cb.name ? cb.name + " — " : "") + "Konvu Inventory";
  document.getElementById("scope-chip").textContent = cb.name || "";
}

document.addEventListener("click", (e) => {
  const row = e.target.closest(".rrow");
  if (row) {
    if (row.dataset.nav) return setView(row.dataset.nav);
  }

  if (e.target.closest("#panel-close") || e.target.id === "scrim") return closePanel();

  const ptab = e.target.closest(".ptab");
  if (ptab) {
    panelState.tab = ptab.dataset.tab;
    panelState.expandedProtects = false;
    renderPanel();
    return;
  }

  if (e.target.closest("#protects-more")) {
    panelState.expandedProtects = !panelState.expandedProtects;
    renderPanel();
    return;
  }

  const protects = e.target.closest("[data-open-asset]");
  if (protects) return openAsset(protects.dataset.openAsset);

  const stRow = e.target.closest(".subtable-row[data-open]");
  if (stRow) {
    const id = stRow.dataset.open;
    return controlById.get(id) ? openControl(id) : openAsset(id);
  }

  const th = e.target.closest("thead th[data-key]");
  if (th) {
    const key = th.dataset.key;
    const current = state.sort.key ? state.sort : viewOf().defaultSort;
    if (current.key === key) state.sort = { key, dir: current.dir * -1 };
    else state.sort = { key, dir: 1 };
    render();
    return;
  }

  const tr = e.target.closest("tbody tr");
  if (tr && tr.dataset.id) openRow(tr.dataset.id);
});

/* The rail re-renders, so the search box is bound by delegation rather than
 * by a handler on an element that gets replaced. */
document.addEventListener("input", (e) => {
  if (e.target.id !== "q") return;
  state.q = e.target.value;
  state.cursor = -1;
  render();
});

document.addEventListener("keydown", (e) => {
  const inField = e.target.tagName === "INPUT";
  if (e.key === "Escape") {
    if (inField) { e.target.blur(); return; }
    closePanel();
    return;
  }
  if (inField) return;

  if (e.key === "/") { e.preventDefault(); document.getElementById("q").focus(); return; }

  const rows = Array.from(document.querySelectorAll("tbody tr"));
  if (!rows.length) return;

  if (e.key === "j" || e.key === "ArrowDown") {
    e.preventDefault();
    state.cursor = Math.min(state.cursor + 1, rows.length - 1);
  } else if (e.key === "k" || e.key === "ArrowUp") {
    e.preventDefault();
    state.cursor = Math.max(state.cursor - 1, 0);
  } else if (e.key === "Enter") {
    const r = rows[state.cursor];
    if (r && r.dataset.id) openRow(r.dataset.id);
    return;
  } else return;

  for (const r of rows) r.removeAttribute("aria-selected");
  const cur = rows[state.cursor];
  if (cur) {
    cur.setAttribute("aria-selected", "true");
    cur.scrollIntoView({ block: "nearest" });
  }
});

/* ------------------------------------------------------------------ boot -- */

renderScopeChip();

document.getElementById("scroll").addEventListener("scroll", (e) => {
  document.getElementById("table-footer").classList.toggle("scrolled", e.target.scrollTop > 0);
});
/* Open on the densest asset type that has rows, so the first screen is never
 * an empty table just because this repository exposes no endpoints. */
const endpointsView = VIEWS.find((v) => v.value === "endpoint");
const firstView =
  viewCount(endpointsView) > 0
    ? endpointsView
    : VIEWS.filter((v) => v.kind && viewCount(v) > 0).sort((a, b) => viewCount(b) - viewCount(a))[0] ||
      VIEWS[0];
setView(firstView.value);
</script>
