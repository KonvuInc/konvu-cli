<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Konvu Inventory</title>
<style>
/* @@TOKENS@@ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: var(--konvu-font);
  font-size: var(--konvu-fs-base);
  color: var(--konvu-ink-body);
  background: var(--konvu-mist-1);
  -webkit-font-smoothing: antialiased;
}

body { display: flex; flex-direction: column; overflow: hidden; }

code, .mono { font-family: var(--konvu-mono); font-size: var(--konvu-fs-sm); }

/* ------------------------------------------------------------------ shell --
 * _auth.module.css: a transparent app background, a persistent left rail that
 * lives OUTSIDE the card, and the page itself in a 16px-radius card. That
 * split is what makes the product read as a shell rather than a page.
 */

body { background: var(--konvu-app-bg); }

header.brand {
  flex: none;
  height: 68px;
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: transparent;
}
header.brand h1 {
  margin: 0;
  font-size: var(--konvu-fs-h2);
  font-weight: 600;
  color: var(--konvu-nav-ink);
  letter-spacing: var(--konvu-nav-tracking);
}
.brand-meta {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-left: auto;
  font-size: var(--konvu-fs-sm);
  color: var(--konvu-ink-muted);
}
.brand-meta b { font-weight: 500; color: var(--konvu-ink-body); }

/* .shellSplit — the rail slot and the card, side by side. */
main {
  flex: 1;
  display: flex;
  flex-direction: row;
  min-height: 0;
  margin: 0 8px 8px 0;
  overflow: hidden;
}

/* --------------------------------------------------------------- the rail --
 * TriageRail.module.css. Authored at the handoff's real pixel sizes.
 */
aside.rail {
  flex: 0 0 var(--konvu-rail-width);
  width: var(--konvu-rail-width);
  box-sizing: border-box;
  height: 100%;
  padding: 10px 12px 12px 16px;
  display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto;
  line-height: normal;
  scrollbar-width: thin;
  scrollbar-color: rgba(45, 18, 102, 0.18) transparent;
}
aside.rail::-webkit-scrollbar { width: 6px; }
aside.rail::-webkit-scrollbar-track { background: transparent; }
aside.rail::-webkit-scrollbar-thumb { background: rgba(45, 18, 102, 0.18); border-radius: 3px; }

/* `.scopeWell` — the scope sitting above the filters, recessed one level. */
.well {
  border-radius: 10px;
  background: var(--konvu-rail-well-bg);
  padding: 6px;
  display: flex; flex-direction: column; gap: 2px;
}
.well-header { display: flex; align-items: center; justify-content: space-between; padding: 0 0 2px 6px; }
.well-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--konvu-rail-well-label);
}

.rail-section { display: flex; flex-direction: column; gap: 3px; }
.rail-section > .section-label {
  padding: 0 8px 2px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--konvu-rail-section-label);
}

/* `.row` */
.rrow {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  width: 100%;
  height: 30px;
  padding: 0 8px;
  border: none;
  border-radius: 7px;
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  font-weight: 400;
  color: var(--konvu-rail-row-text);
  text-align: left;
  cursor: pointer;
}
.rrow:hover { background: var(--konvu-rail-row-hover); }
.rrow.active { background: var(--konvu-rail-row-selected); color: var(--konvu-rail-ink); font-weight: 600; }
.rrow.active:hover { background: var(--konvu-rail-row-selected); }
.rrow.dead, .rrow.dead:hover {
  background: transparent;
  color: var(--konvu-rail-dimmed-label);
  cursor: default;
}
.rrow.dead .count { color: var(--konvu-rail-dimmed-count); }
.rrow:focus-visible { outline: 2px solid var(--konvu-focus); outline-offset: -2px; }

.rrow .rlabel { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.rrow .rname { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rrow .count {
  flex: 0 0 auto;
  font-family: var(--konvu-mono);
  font-size: 11.5px;
  color: var(--konvu-rail-count);
}
.rrow.active .count { color: var(--konvu-rail-count-active); }
.rrow svg { flex: none; }

/* A scope row lifts out of the well in white rather than taking a fill. */
.well .rrow { height: 28px; padding: 0 6px; border-radius: 6px; }
.well .rrow.active, .well .rrow.active:hover {
  background: #fff;
  box-shadow: var(--konvu-rail-well-active-shadow);
}
.well .rrow:not(.active):hover { background: var(--konvu-rail-well-button-hover); }

/* --------------------------------------------------------------- the card --
 * `.railCard`. Carries the surface; `main` carries the geometry.
 */
section.card {
  flex: 1 1 auto;
  min-width: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
  isolation: isolate;
  background: var(--konvu-card-bg);
  border: 1px solid var(--konvu-card-bd);
  border-radius: var(--konvu-card-radius);
  box-shadow: var(--konvu-card-shadow);
}

/* PageHeader.tsx: 62px, a 24px gutter, and a gray[2] hairline. */
.page-header {
  flex: none;
  min-height: var(--konvu-page-header-h);
  padding: 0 var(--konvu-page-gutter);
  border-bottom: 1px solid var(--konvu-page-header-bd);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.page-header .left {
  display: flex; align-items: center; gap: 16px;
  min-width: 0; flex: 1 1 auto;
}
.page-header h2 {
  margin: 0;
  font-size: var(--konvu-fs-h1);
  font-weight: 600;
  color: var(--konvu-ink);
  flex-shrink: 0;
}

/* PageHeader right slot. One line with an ellipsis: the summary is context,
 * not content, and must never push the title around. */
.repo-summary {
  margin: 0;
  min-width: 0;
  flex: 0 1 auto;
  font-size: var(--konvu-fs-sm);
  line-height: 1.4;
  color: var(--konvu-ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: right;
  max-width: 46%;
}
.repo-summary:empty { display: none; }

/* `.scopeChip` — inert while the rail is open, so the scope stays readable. */
.scope-chip {
  display: inline-flex; align-items: center; gap: 5px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  height: 24px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  font-family: var(--konvu-mono);
  font-size: 12.5px;
  color: var(--konvu-rail-count-active);
  white-space: nowrap;
}

.search-wrap { position: relative; }

.content-scroll { flex: 1; overflow: auto; }

/* ----------------------------------------------------------------- table -- */

/* min-width keeps the columns readable when the detail panel opens: the
 * scroller takes the overflow rather than the cells crushing. */
table { width: 100%; min-width: 760px; border-collapse: separate; border-spacing: 0; }
thead th:nth-child(2) { width: 150px; }
thead th:nth-child(3) { width: 130px; }
thead th:nth-child(4) { width: 90px; }

thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--konvu-mist-1);
  border-bottom: 1px solid var(--konvu-border);
  text-align: left;
  font-size: var(--konvu-fs-xs);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--konvu-ink-faint);
  padding: 9px 12px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
thead th:hover { color: var(--konvu-ink-body); }
thead th .arrow { opacity: 0.55; margin-left: 4px; }

/* Row treatment from styles.module.css `.assetRow`: a mist-2 hairline, the
 * near-white violet hover, and the deepPurple-3 focus ring. */
tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--konvu-mist-2);
  vertical-align: top;
  font-size: var(--konvu-fs-sm);
}
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--konvu-row-hover); }
tbody tr[aria-selected="true"] td { background: var(--konvu-mist-2); }
tbody tr:focus-visible {
  outline: 2px solid var(--konvu-focus);
  outline-offset: -2px;
}

/* The product's name cell: 13px, 600, black, truncated. Endpoint groups are
 * additionally capitalised. */
.cell-name {
  color: #000;
  font-weight: 600;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cell-name.cap { text-transform: capitalize; }

/* Counts are monospace, with their unit and any qualifier beneath. */
.num { font-family: var(--konvu-mono); font-size: var(--konvu-fs-sm); color: var(--konvu-gray-7); }
.unit { font-size: var(--konvu-fs-xs); color: var(--konvu-ink-faint); margin-left: 4px; }
.cell-note { font-size: var(--konvu-fs-xs); color: var(--konvu-ink-faint); margin-top: 2px; }
.dash { color: var(--konvu-ink-faint); }

/* Property in a list cell is plain gray text; the accent belongs to a control
 * card, not to a row. */
.plain-prop { font-size: var(--konvu-fs-sm); color: var(--konvu-gray-7); }
.cell-sub {
  font-family: var(--konvu-mono);
  font-size: var(--konvu-fs-xs);
  color: var(--konvu-ink-muted);
  margin-top: 2px;
  word-break: break-all;
}

/* One line per declaration. A 90-character Go symbol wrapping to three lines
 * makes 600 rows unscannable, which is the whole complaint this page answers.
 * The full value is always in the panel and the title attribute. */
td.decl-cell { max-width: 320px; }
td.decl-cell .cell-sub {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  word-break: normal;
  direction: rtl;          /* keep the symbol, elide the leading path */
  text-align: left;
}

/* ----------------------------------------------------------------- chips -- */

/* Presence is a dot plus a label, never a filled pill -- `PresenceTag` in
 * components/mappedAssets/presence.tsx. Matching it is most of why this page
 * reads as the same product. */
.presence { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.presence .label { font-size: var(--konvu-fs-xs); }

.p-present .dot { background: var(--konvu-present); }
.p-partial .dot { background: var(--konvu-partial); }
.p-absent  .dot { background: var(--konvu-absent); }
.p-none    .dot { background: var(--konvu-none); }
.p-present .label { color: var(--konvu-present); }
.p-partial .label { color: var(--konvu-partial); }
.p-absent  .label { color: var(--konvu-absent); }
.p-none    .label { color: var(--konvu-none); }

/* CoverageSummary: present / partial / absent counts, absent always rendered
 * even at zero so a gap never hides behind a missing column. */
.coverage { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
.coverage-item {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--konvu-mono);
  font-size: 11px;
  line-height: 1.2;
  color: var(--konvu-count);
}
.coverage-item.zero { color: var(--konvu-count-zero); }
.coverage-item.emphasis { font-weight: 600; }

/* Asset kind reads as an icon plus a noun, the way `AssetKindIcon` does. */
.kind { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.kind svg { flex: none; color: var(--konvu-purple-5); }
.kind .label {
  font-size: var(--konvu-fs-sm);
  color: var(--konvu-ink-body);
  white-space: nowrap;
}

/* styles.module.css `.method` */
.method {
  flex-shrink: 0;
  min-width: 92px;
  color: var(--konvu-method);
  font-family: var(--konvu-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.3;
  text-transform: uppercase;
}
.route-preview { display: flex; align-items: center; gap: 7px; margin-top: 4px; min-width: 0; }
.route-preview .method { min-width: auto; }
.route-preview .path {
  font-family: var(--konvu-mono);
  font-size: var(--konvu-fs-xs);
  color: var(--konvu-gray-5);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.route-preview .more { font-size: var(--konvu-fs-xs); color: var(--konvu-ink-faint); flex: none; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--konvu-border);
  font-size: var(--konvu-fs-xs);
  font-weight: 500;
  white-space: nowrap;
  color: var(--konvu-ink-muted);
  background: var(--konvu-mist-1);
}
.chip + .chip { margin-left: 4px; }
.chip.ambiguous {
  color: var(--konvu-ink-muted);
  background: transparent;
  border: var(--konvu-border-dashed);
}

/* ------------------------------------------------------------- empty row -- */

.empty {
  padding: 48px 24px;
  text-align: center;
  color: var(--konvu-ink-muted);
}
.empty h4 { margin: 0 0 6px; font-size: var(--konvu-fs-h2); color: var(--konvu-ink); font-weight: 600; }
.empty p { margin: 0; font-size: var(--konvu-fs-sm); line-height: 1.6; }

/* ----------------------------------------------------------------- panel -- */

aside.panel {
  flex: none; width: 520px;
  background: #fff;
  box-shadow: var(--konvu-shadow-panel);
  overflow-y: auto;
  display: none;
}
aside.panel.open { display: block; }

.panel-head {
  position: sticky; top: 0; z-index: 3;
  background: #fff;
  border-bottom: 1px solid var(--konvu-border);
  padding: 14px 18px;
}
#panel-chips {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-top: 2px;
}
.panel-head h2 {
  margin: 0 0 6px; font-size: var(--konvu-fs-h2); font-weight: 600;
  color: var(--konvu-ink); padding-right: 28px; line-height: 1.35;
}
.panel-close {
  position: absolute; top: 12px; right: 14px;
  border: 0; background: none; cursor: pointer;
  font-size: 18px; line-height: 1; color: var(--konvu-ink-faint); padding: 4px;
}
.panel-close:hover { color: var(--konvu-ink); }

.panel-body { padding: 4px 18px 40px; }

/* SectionCard.tsx: a 14px-radius bordered panel with an 18px/15px header and a
 * 15px deep-purple heading. */
.sec {
  border: 1px solid var(--konvu-card-border);
  border-radius: var(--konvu-radius-card);
  overflow: hidden;
  margin-top: 16px;
}
.sec > h4 {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0;
  padding: 15px 18px;
  font-size: 15px;
  font-weight: 600;
  color: var(--konvu-purple-7);
  text-transform: none;
  letter-spacing: normal;
}
.sec > h4 .badge {
  font-size: var(--konvu-fs-xs);
  font-weight: 500;
  color: var(--konvu-gray-5);
  background: var(--konvu-gray-1);
  border-radius: 999px;
  padding: 1px 8px;
}
.sec-body { padding: 0 18px 18px; }

/* AssetOverview.tsx `HairlineGroup`. */
.hair { border-top: 1px solid var(--konvu-hairline); padding-top: 12px; }
.eyebrow {
  font-size: var(--konvu-fs-xs);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--konvu-method);
  margin: 0 0 4px;
}

.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: var(--konvu-fs-sm); }
.kv dt { color: var(--konvu-ink-muted); }
.kv dd { margin: 0; color: var(--konvu-ink-body); font-family: var(--konvu-mono); font-size: var(--konvu-fs-xs); word-break: break-all; }

.prose { font-size: var(--konvu-fs-sm); line-height: 1.55; color: var(--konvu-gray-7); margin: 0; }

/* A control entry, accented by the security property it belongs to --
 * styles.module.css `.propertyGroup` / `.propertyHeader`. */
.card {
  --control-accent: var(--konvu-prop-default);
  border: 1px solid var(--konvu-hairline);
  border-left: 3px solid var(--control-accent);
  border-radius: var(--konvu-radius-sub);
  overflow: hidden;
  margin-bottom: 10px;
  background: #fff;
}
.card[data-property="authorization"]    { --control-accent: var(--konvu-prop-authorization); }
.card[data-property="authentication"]   { --control-accent: var(--konvu-prop-authentication); }
.card[data-property="confidentiality"]  { --control-accent: var(--konvu-prop-confidentiality); }
.card[data-property="integrity"]        { --control-accent: var(--konvu-prop-integrity); }
.card[data-property="availability"]     { --control-accent: var(--konvu-prop-availability); }
.card[data-property="non_repudiation"]  { --control-accent: var(--konvu-prop-non_repudiation); }

.card-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: 34px;
  padding: 8px 10px;
  color: var(--control-accent);
  background: color-mix(in srgb, var(--control-accent) 7%, white);
  border-bottom: 1px solid color-mix(in srgb, var(--control-accent) 20%, white);
}
.card-head .title { font-weight: 600; color: var(--control-accent); font-size: var(--konvu-fs-sm); }
.card-head .prop {
  font-family: var(--konvu-font);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  line-height: 1.3;
  text-transform: uppercase;
  color: var(--control-accent);
  opacity: 0.82;
  margin-left: auto;
}
.card-body { padding: 10px 12px; }

pre.quote {
  margin: 7px 0 0;
  padding: 8px 10px;
  background: var(--konvu-purple-8);
  color: #e9e4f5;
  border-radius: var(--konvu-radius-sm);
  font-family: var(--konvu-mono);
  font-size: var(--konvu-fs-xs);
  line-height: 1.55;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.decl {
  font-family: var(--konvu-mono);
  font-size: var(--konvu-fs-xs);
  color: var(--konvu-purple-6);
  word-break: break-all;
}

ul.checked { margin: 7px 0 0; padding-left: 16px; font-size: var(--konvu-fs-xs); line-height: 1.6; color: var(--konvu-ink-muted); }
ul.checked li { margin-bottom: 3px; }
ul.checked li::marker { color: var(--konvu-mist-6); }

ul.plain { margin: 0; padding-left: 15px; font-size: var(--konvu-fs-xs); line-height: 1.7; color: var(--konvu-ink-body); font-family: var(--konvu-mono); }
ul.plain li { word-break: break-all; }

.urlpill {
  display: inline-block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: bottom;
  font-family: var(--konvu-mono);
  font-size: var(--konvu-fs-xs);
  background: var(--konvu-purple-0);
  color: var(--konvu-purple-7);
  border-radius: var(--konvu-radius-sm);
  padding: 2px 7px;
  margin: 0 4px 4px 0;
}
.urlpill.broad { background: var(--konvu-mist-2); color: var(--konvu-ink-muted); border: var(--konvu-border-dashed); }

.inline-note {
  font-size: var(--konvu-fs-xs);
  color: var(--konvu-ink-muted);
  line-height: 1.55;
  margin: 6px 0 0;
}

.footer-note {
  flex: none;
  border-top: 1px solid var(--konvu-border);
  background: #fff;
  padding: 7px 20px;
  font-size: var(--konvu-fs-xs);
  color: var(--konvu-ink-faint);
  display: flex; gap: 16px; flex-wrap: wrap;
}
kbd {
  font-family: var(--konvu-mono);
  font-size: 10.5px;
  border: 1px solid var(--konvu-border-strong);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
  background: var(--konvu-mist-0);
  color: var(--konvu-ink-body);
}
</style>
</head>
<body>

<header class="brand">
  <h1 id="repo-name">Inventory</h1>
  <div class="brand-meta" id="repo-meta"></div>
</header>

<main>
  <aside class="rail" id="rail"></aside>

  <section class="card">
    <div class="page-header">
      <div class="left">
        <h2 id="view-title">Inventory</h2>
        <span class="scope-chip" id="scope-chip"></span>
      </div>
      <p class="repo-summary" id="repo-summary"></p>
    </div>

    <div id="notices"></div>

    <div class="content-scroll" id="scroll">
      <table id="tbl">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none"></div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="panel-head">
      <button class="panel-close" id="panel-close" title="Close (Esc)">&times;</button>
      <h2 id="panel-title"></h2>
      <div id="panel-chips"></div>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</main>

<div class="footer-note">
  <span><kbd>/</kbd> search</span>
  <span><kbd>j</kbd> <kbd>k</kbd> move</span>
  <span><kbd>Enter</kbd> open</span>
  <span><kbd>Esc</kbd> close</span>
  <span id="foot-count"></span>
</div>

<script id="baseline-data" type="application/json">/* @@BASELINE@@ */</script>
<script>
"use strict";

/* ===========================================================================
 * Konvu inventory viewer.
 *
 * Reads one baseline.json (schema_version 1) inlined above and renders it.
 * No framework, no network, no storage. Everything below is derivation over
 * the artifact -- nothing is asserted that the baseline does not contain.
 * ======================================================================== */

const DATA = JSON.parse(document.getElementById("baseline-data").textContent);

const ASSETS = DATA.assets || [];
const CONTROLS = DATA.controls || [];
const IMPLS = DATA.implementations || [];
const ROUTES = DATA.routes || [];
const OBS_CONTROLS = (DATA.observations && DATA.observations.controls) || [];

const controlById = new Map(CONTROLS.map((c) => [c.id, c]));
const implById = new Map(IMPLS.map((i) => [i.id, i]));

/* ------------------------------------------------------------------ util -- */

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

const RANK = { absent: 0, partial: 1, present: 2 };

/* Repository-wide presence for one asset: "none" when the mapping linked no
 * control at all -- which is an unknown, not a failure -- otherwise the
 * weakest status recorded across its links. */
function assetCoverage(a) {
  const links = a.controls || [];
  if (!links.length) return "none";
  let worst = "present";
  for (const l of links) {
    const s = RANK[l.status] === undefined ? "partial" : l.status;
    if (RANK[s] < RANK[worst]) worst = s;
  }
  return worst;
}

/* --------------------------------------------------- token -> URL joining --
 *
 * Endpoint assets carry `tokens[]`: literal regex fragments the engine matched
 * on. `routes[]` is a separate collection of literal paths. Joining them is
 * what makes "search for /api/v1/users" find the group that covers it.
 *
 * The join is only sound when a token is specific. A token list frequently
 * ends in a bare catch-all (`@main\.route\(`, `http\.NewRequest\(`) that
 * matches every route in the repo. Attributing all of them to that asset would
 * assert "public home covers /admin", which the baseline does not claim. So a
 * token that resolves to more than BROAD_RATIO of all routes is kept, but
 * marked broad and never counted as coverage.
 */

const BROAD_RATIO = 0.4;
const MAX_ALTERNATIVES = 32;

/**
 * Expand regex alternation groups into concrete strings.
 * `/(a|b|c)` -> `/a`, `/b`, `/c`. Bounded, because a token is attacker-shaped
 * only in the sense that it comes from a generated artifact, but a pathological
 * nest should not hang the page.
 */
function expandAlternations(s) {
  let out = [s];
  for (let depth = 0; depth < 4; depth++) {
    let changed = false;
    const next = [];
    for (const v of out) {
      const m = v.match(/\(([^()]*)\)/);
      if (!m) { next.push(v); continue; }
      changed = true;
      for (const opt of m[1].split("|")) {
        next.push(v.slice(0, m.index) + opt + v.slice(m.index + m[0].length));
      }
    }
    out = next.slice(0, MAX_ALTERNATIVES);
    if (!changed) break;
  }
  return out;
}

/**
 * Pull literal path fragments out of one regex-ish token.
 *
 * Tokens look like `@main\.route\("/(password-reminder|reset-password)`. The
 * useful part is the path literal, which may carry an alternation group and
 * Flask/Django-style `<param>` segments that appear verbatim in `routes[].path`
 * too, so they compare directly.
 */
function literalPaths(token) {
  if (typeof token !== "string" || token.indexOf("/") === -1) return [];
  const plain = token.replace(/\\(.)/g, "$1"); // `\.` -> `.`
  const out = [];
  const re = /\/[A-Za-z0-9_\-./{}<>:*()|]*/g;
  let m;
  while ((m = re.exec(plain)) !== null) {
    for (const variant of expandAlternations(m[0])) {
      // Cut at a regex quantifier and drop a trailing slash, but keep bare "/"
      // -- it is the root route, and it is matched exactly, never as a prefix.
      let frag = variant.replace(/[*?+].*$/, "");
      if (frag.length > 1) frag = frag.replace(/\/+$/, "");
      if (frag === "/" || frag.length > 1) out.push(frag);
    }
  }
  return out;
}

/**
 * Does a route path belong to this literal fragment?
 *
 * Bare "/" matches only the root route. Anything else matches itself or a path
 * beneath it, so `/<project_id>/members` covers `/<project_id>/members/add`.
 */
function routeMatches(routePath, frag) {
  if (!routePath || !frag) return false;
  if (frag === "/") return routePath === "/";
  return routePath === frag || routePath.startsWith(frag + "/") || routePath.startsWith(frag);
}

function buildRouteIndex() {
  const byAsset = new Map(); // assetId -> {urls:Set, broad:Set}
  const byRoute = new Map(); // routeId -> [{assetId, broad}]

  for (const a of ASSETS) {
    const tokens = a.tokens || [];
    const urls = new Set();
    const broad = new Set();

    // Explicit routes[] on the asset are authoritative; no inference needed.
    for (const r of a.routes || []) {
      if (r && r.path) urls.add(r.path);
    }

    for (const tok of tokens) {
      const frags = literalPaths(tok);
      if (!frags.length) continue;
      const hits = [];
      for (const r of ROUTES) {
        if (frags.some((f) => routeMatches(r.path, f))) hits.push(r);
      }
      if (!hits.length) continue;
      const isBroad = ROUTES.length > 0 && hits.length / ROUTES.length > BROAD_RATIO;
      for (const r of hits) {
        (isBroad ? broad : urls).add(r.path);
        if (!byRoute.has(r.id)) byRoute.set(r.id, []);
        byRoute.get(r.id).push({ assetId: a.id, broad: isBroad });
      }
    }
    // A URL the asset declares outright is never also "reached via a catch-all":
    // authoritative attribution wins over the inferred kind.
    for (const u of urls) broad.delete(u);

    if (urls.size || broad.size) byAsset.set(a.id, { urls, broad });
  }
  return { byAsset, byRoute };
}

const ROUTE_INDEX = buildRouteIndex();

function assetUrls(a) {
  const e = ROUTE_INDEX.byAsset.get(a.id);
  return e ? Array.from(e.urls) : [];
}
function assetBroadUrls(a) {
  const e = ROUTE_INDEX.byAsset.get(a.id);
  return e ? Array.from(e.broad) : [];
}

/* ------------------------------------------------------------ derivation -- */

/* --- data-object grouping, ported from data.ts -----------------------------
 * A data object is a model plus the version/audit tables generated for it and
 * the fields it owns. The product groups them this way, and its coverage cell
 * rolls up the model's own control links together with every field's, so a
 * classified field is never invisible behind an unclassified model.
 */

const VERSION_SUFFIX = /_version$/;

function childFields(objectId) {
  return ASSETS.filter((a) => a.kind === "field" && a.parent === objectId);
}

/**
 * The identifier to pair a version table with its model.
 *
 * data.ts matches on `name`, because the hosted graph names an object after its
 * table. This artifact names it for a human -- "Bill version history" declared
 * at `...#bill_version` -- so matching on `name` alone pairs nothing and the
 * Version tables column is dead in every row. Prefer the declared symbol and
 * fall back to the name, which reproduces the product's behaviour on both
 * naming conventions.
 */
function objectKey(asset) {
  const decl = asset.decl || "";
  const symbol = decl.includes("#") ? decl.slice(decl.lastIndexOf("#") + 1) : "";
  return (symbol || asset.name || "").toLowerCase();
}

function isVersionTable(asset) {
  return VERSION_SUFFIX.test(objectKey(asset)) || VERSION_SUFFIX.test(asset.name);
}

function dataObjectGroups() {
  const objects = ASSETS.filter((a) => a.kind === "object");
  const versionTables = objects.filter(isVersionTable);
  const models = objects.filter((o) => !isVersionTable(o));

  const groups = models.map((model) => {
    const key = objectKey(model);
    const shadows = versionTables.filter(
      (t) => objectKey(t).replace(VERSION_SUFFIX, "") === key
    );
    const fields = childFields(model.id);
    return {
      model,
      versionTables: shadows,
      fields,
      classifiedFields: fields.filter((f) => (f.controls || []).length > 0),
    };
  });

  // A version table with no matching model still gets a row, so no object in
  // the repository goes unlisted.
  const paired = new Set(groups.flatMap((g) => g.versionTables.map((t) => t.id)));
  for (const orphan of versionTables.filter((t) => !paired.has(t.id))) {
    groups.push({ model: orphan, versionTables: [], fields: [], classifiedFields: [] });
  }
  return groups;
}

/** Sorting a coverage cell by its gaps is what a reviewer actually wants. */
function byGaps(c) {
  return c.absent * 1000 + c.partial;
}

/** `coverageOf` — present / partial / absent counts over a control's statuses. */
function coverageOf(statuses) {
  return {
    present: statuses.filter((s) => s === "present").length,
    partial: statuses.filter((s) => s === "partial").length,
    absent: statuses.filter((s) => s === "absent").length,
    total: statuses.length,
  };
}

const VIEW_ROWS = ASSETS.map((a) => {
  const cov = assetCoverage(a);
  const counts = coverageOf((a.controls || []).map((l) => l.status));
  const urls = assetUrls(a);
  const props = new Set();
  for (const l of a.controls || []) {
    const c = controlById.get(l.control_id);
    if (c && c.property) props.add(c.property);
  }
  const haystack = [
    a.name, a.decl, a.description, a.id,
    (a.paths || []).join(" "),
    (a.tokens || []).join(" "),
    urls.join(" "),
    (a.controls || []).map((l) => {
      const c = controlById.get(l.control_id);
      return (c && c.name) || l.control_id;
    }).join(" "),
  ].join(" ").toLowerCase();

  return { asset: a, cov, counts, urls, props: Array.from(props), haystack };
});

const KINDS = ["endpoint", "object", "field", "code"];
const COVS = ["present", "partial", "absent", "none"];
const PROPS = Array.from(new Set(CONTROLS.map((c) => c.property).filter(Boolean))).sort();

const COV_LABEL = {
  present: "Present",
  partial: "Partial",
  absent: "Absent",
  none: "No control linked",
};

/* ------------------------------------------------------------------ state -- */

/**
 * The rail's destinations, mirroring the product's inventory asset types
 * (InventoryAssetRail `SECURITY_GRAPH_ASSET_TYPES`): an asset type is where you
 * navigate to, not a filter you tick. Coverage and property remain filters.
 */
const VIEWS = [
  { value: "endpoint", label: "Endpoints", kind: "endpoint" },
  { value: "object", label: "Data objects", kind: "object" },
  { value: "controls", label: "Controls" },
  // Local-only. The hosted graph lists neither, but the baseline carries both
  // and dropping rows the artifact contains would be the wrong kind of
  // faithfulness. Fields are NOT a destination: like the product, they are
  // folded into the data object that owns them.
  { value: "code", label: "Code assets", kind: "code" },
  { value: "urls", label: "URLs" },
];

const state = {
  view: "endpoint",
  q: "",
  covs: new Set(),
  props: new Set(),
  /** `null` means "whatever this table's default is" — see tableSpec(). */
  sort: { key: null, dir: 1 },
  selected: null,
  cursor: -1,
};

function isAssetView(v) {
  return VIEWS.some((x) => x.value === (v || state.view) && x.kind);
}
function currentKind() {
  const v = VIEWS.find((x) => x.value === state.view);
  return v ? v.kind : null;
}
function viewLabel(v) {
  const found = VIEWS.find((x) => x.value === (v || state.view));
  return found ? found.label : "Inventory";
}
function viewCount(v) {
  // Data objects are grouped, so the count is groups, not raw object assets;
  // controls are the implemented ones, which is what the table lists.
  if (v.value === "object") return dataObjectGroups().length;
  if (v.value === "controls") return implementedControls().length;
  if (v.kind) return ASSETS.filter((a) => a.kind === v.kind).length;
  return ROUTES.length;
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  const kind = currentKind();
  let rows = VIEW_ROWS.filter((r) => {
    if (kind && r.asset.kind !== kind) return false;
    if (state.covs.size && !state.covs.has(r.cov)) return false;
    if (state.props.size && !r.props.some((p) => state.props.has(p))) return false;
    for (const t of terms) if (r.haystack.indexOf(t) === -1) return false;
    return true;
  });

  const { key, dir } = state.sort;
  rows = rows.slice().sort((x, y) => {
    let a, b;
    if (key === "kind") { a = x.asset.kind; b = y.asset.kind; }
    else if (key === "cov") { a = RANK[x.cov] === undefined ? -1 : RANK[x.cov]; b = RANK[y.cov] === undefined ? -1 : RANK[y.cov]; }
    else if (key === "controls") { a = (x.asset.controls || []).length; b = (y.asset.controls || []).length; }
    else if (key === "decl") { a = x.asset.decl || ""; b = y.asset.decl || ""; }
    else { a = (x.asset.name || "").toLowerCase(); b = (y.asset.name || "").toLowerCase(); }
    if (a < b) return -1 * dir;
    if (a > b) return 1 * dir;
    return 0;
  });
  return rows;
}

/* ------------------------------------------------------------- rendering -- */

function chip(cls, text, title) {
  return `<span class="chip ${cls}"${title ? ` title="${esc(title)}"` : ""}>${esc(text)}</span>`;
}

/* --- product vocabulary ----------------------------------------------------
 * These four mirror components/mappedAssets/presence.tsx one for one, so a row
 * here reads the same as a row in the dashboard's inventory tables.
 */

/** `AssetKindIcon` — the same lucide glyphs at the same 1.7 stroke weight. */

};

/** `assetKindLabels` in presence.tsx. */
const KIND_LABEL = {
  endpoint: "Endpoint group",
  object: "Data object",
  field: "Field",
  code: "Code asset",
};

function kindIcon(kind, size) {
  const paths = KIND_ICON_PATHS[kind];
  if (!paths) return "";
  return (
    `<svg width="${size || 18}" height="${size || 18}" viewBox="0 0 24 24" fill="none" ` +
    `stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
    paths + `</svg>`
  );
}

function kindCell(kind) {
  return (
    `<span class="kind">${kindIcon(kind, 18)}` +
    `<span class="label">${esc(KIND_LABEL[kind] || kind)}</span></span>`
  );
}

/** `PresenceTag` — a dot and a capitalised label, never a filled pill. */
function presenceTag(presence) {
  const cls = presence === "none" ? "none" : presence;
  return (
    `<span class="presence p-${cls}"><span class="dot"></span>` +
    `<span class="label">${esc(COV_LABEL[presence] || presence)}</span></span>`
  );
}

/**
 * `CoverageSummary` — present / partial / absent counts. Absent is always
 * rendered, even at zero, so a gap never hides behind a missing column.
 */
function coverageSummary(counts, label) {
  const title =
    (label ? label + ": " : "") +
    `${counts.present} present, ${counts.partial} partial, ${counts.absent} absent`;
  const items = ["present", "partial", "absent"]
    .map((p) => {
      const n = counts[p] || 0;
      const emphasis = p === "absent" && n > 0 ? " emphasis" : "";
      return (
        `<span class="coverage-item${n === 0 ? " zero" : ""}${emphasis}">` +
        `<span class="dot p-${p}" style="background:var(--konvu-${p})"></span>${n}</span>`
      );
    })
    .join("");
  return `<span class="coverage" title="${esc(title)}" aria-label="${esc(title)}">${items}</span>`;
}

/**
 * `SectionCard` — a 14px-radius bordered panel with a 15px deep-purple heading
 * and an optional count badge. The panel is built from these so it reads like
 * the repository overview rather than a stack of loose headings.
 */
function section(title, body, badge) {
  if (!body) return "";
  return (
    `<div class="sec"><h4>${esc(title)}` +
    (badge != null ? `<span class="badge">${esc(badge)}</span>` : "") +
    `</h4><div class="sec-body">${body}</div></div>`
  );
}

/** `propertyLabel` in data.ts. */
function propertyLabel(property) {
  if (!property) return "";
  if (property === "non_repudiation") return "Non-repudiation";
  return property.charAt(0).toUpperCase() + property.slice(1);
}

/** Security property rendered as the accent eyebrow, per styles.module.css. */
function propertyCell(property) {
  if (!property) return "—";
  return (
    `<span class="eyebrow" style="color:var(--konvu-prop-${esc(property)},var(--konvu-prop-default));margin:0">` +
    `${esc(propertyLabel(property))}</span>`
  );
}

/** `RoutePreview` — the first route of a group, with a count of the rest. */
function routePreview(urls, method) {
  if (!urls.length) return "";
  return (
    `<span class="route-preview"><span class="method">${esc(method || "route")}</span>` +
    `<span class="path">${esc(urls[0])}</span>` +
    (urls.length > 1 ? `<span class="more">+${urls.length - 1}</span>` : "") +
    `</span>`
  );
}

/** `languages` is a list of {name, files, lines}; older artifacts used strings. */
function languageNames(list) {
  if (!Array.isArray(list)) return [];
  return list.map((l) => (typeof l === "string" ? l : l && l.name)).filter(Boolean);
}

function renderHeader() {
  const cb = DATA.codebase || {};
  const run = DATA.run || {};
  const vcs = cb.git || {};
  document.getElementById("repo-name").textContent = cb.name || "Inventory";
  document.title = (cb.name ? cb.name + " — " : "") + "Konvu Inventory";

  const bits = [];
  if (run.status) bits.push(`<span><b>${esc(run.status)}</b></span>`);

  // Provenance first: a map is only meaningful against the commit it read.
  if (vcs.short_commit || vcs.commit) {
    const sha = vcs.short_commit || String(vcs.commit).slice(0, 8);
    bits.push(
      `<span title="Mapped against this commit">` +
      (vcs.branch ? `${esc(vcs.branch)} @ ` : "") +
      `<b class="mono">${esc(sha)}</b></span>`
    );
  }
  if (vcs.dirty) {
    bits.push(
      `<span class="chip partial" title="The working tree had uncommitted changes when this map ran, so it does not describe any commit exactly.">uncommitted changes</span>`
    );
  }

  const langs = languageNames(cb.languages);
  if (langs.length) bits.push(`<span>${esc(langs.join(", "))}</span>`);

  bits.push(`<span><b>${ASSETS.length}</b> assets</span>`);
  bits.push(`<span><b>${CONTROLS.length}</b> controls</span>`);
  if (ROUTES.length) bits.push(`<span><b>${ROUTES.length}</b> routes</span>`);
  if (run.duration_seconds) {
    bits.push(`<span>${Math.round(run.duration_seconds / 60)} min</span>`);
  }
  if (run.cost && run.cost.display) bits.push(`<span>${esc(run.cost.display)}</span>`);
  document.getElementById("repo-meta").innerHTML = bits.join("");

  if (cb.summary) {
    const summaryEl = document.getElementById("repo-summary");
    summaryEl.textContent = cb.summary;
    summaryEl.title = cb.summary;
  }

}

/* The honesty strip. Both notices exist because a table that renders these
 * silently is worse than a terminal that cannot render them at all. */
function renderNotices() {
  const host = document.getElementById("notices");
  const out = [];
  const tags = [];

  const unlinked = VIEW_ROWS.filter((r) => r.cov === "none").length;
  if (unlinked) {
    const pct = Math.round((unlinked / VIEW_ROWS.length) * 100);
    tags.push(`<b>${pct}%</b> unlinked`);
    out.push(
      `<div class="notice"><b>${unlinked} of ${VIEW_ROWS.length} assets (${pct}%) have no control linked.</b> ` +
      `That is the mapping recording no protection it could attribute here, not a finding that the asset is unprotected. ` +
      `Filter to <em>No control linked</em> to see them.</div>`
    );
  }

  const amb = ASSETS.filter((a) => a.ambiguous).length;
  if (amb) {
    const pct = Math.round((amb / ASSETS.length) * 100);
    tags.push(`<b>${pct}%</b> ambiguous`);
    out.push(
      `<div class="notice"><b>${amb} of ${ASSETS.length} assets (${pct}%) are flagged <code>ambiguous</code> by the engine.</b> ` +
      `The baseline carries no per-asset record of what was individually inspected versus covered by a group pattern, ` +
      `so treat identification as a lead to verify, not a verified fact.</div>`
    );
  }

  const unimplemented = unimplementedControls().length;
  if (unimplemented) {
    tags.push(`<b>${unimplemented}</b> unimplemented`);
    out.push(
      `<div class="notice"><b>${unimplemented} of ${CONTROLS.length} controls have no implementation in the code.</b> ` +
      `The Controls view lists only implemented ones, as the product does: a control nothing implements is an ` +
      `expectation the code fails, which is a finding rather than an asset. They are named here so the omission is visible.</div>`
    );
  }

  const broadAssets = ASSETS.filter((a) => assetBroadUrls(a).length).length;
  if (broadAssets) {
    tags.push(`<b>${broadAssets}</b> catch-all`);
    out.push(
      `<div class="notice"><b>${broadAssets} asset(s) carry a catch-all token</b> that matches most routes in the repository. ` +
      `URLs reached only through such a token are shown dashed and are never counted as coverage.</div>`
    );
  }

  if (!out.length) { host.innerHTML = ""; return; }

  host.innerHTML =
    `<details class="caveats"><summary>` +
    `<span>How much of this is verified</span>` +
    tags.map((t) => `<span class="chip none">${t}</span>`).join("") +
    `</summary><div class="caveat-body">${out.join("")}</div></details>`;
}

/** One rail row: a label, an optional icon, and its count on the right. */
function railRow(opts) {
  const dead = opts.count === 0 && !opts.active;
  return (
    `<button class="rrow${opts.active ? " active" : ""}${dead ? " dead" : ""}"` +
    ` data-nav="${opts.nav || ""}" data-group="${opts.group || ""}" data-value="${esc(opts.value)}"` +
    (dead ? " disabled" : "") +
    `><span class="rlabel">` +
    (opts.icon || "") +
    (opts.dot ? `<span class="dot" style="background:${opts.dot}"></span>` : "") +
    `<span class="rname">${esc(opts.label)}</span></span>` +
    `<span class="count">${opts.count}</span></button>`
  );
}

/**
 * The left rail. Asset types are destinations in a scope well; coverage and
 * security property are filters in labelled sections below, which is the
 * arrangement InventoryAssetRail and TriageRail use.
 */
function renderRail() {
  const out = [];

  out.push(
    `<div class="well"><div class="well-header"><span class="well-label">Asset type</span></div>` +
    VIEWS.map((v) =>
      railRow({
        nav: v.value,
        value: v.value,
        label: v.label,
        count: viewCount(v),
        active: state.view === v.value,
        icon: v.kind ? kindIcon(v.kind, 14) : "",
      })
    ).join("") +
    `</div>`
  );

  out.push(
    `<div class="search-wrap"><input class="search" id="q" type="search" ` +
    `placeholder="${esc(searchPlaceholder())}" autocomplete="off" spellcheck="false" ` +
    `value="${esc(state.q)}" /></div>`
  );

  if (isAssetView()) {
    const kind = currentKind();
    const scoped = VIEW_ROWS.filter((r) => !kind || r.asset.kind === kind);

    const covRows = COVS.map((c) =>
      railRow({
        group: "covs",
        value: c,
        label: COV_LABEL[c],
        count: scoped.filter((r) => r.cov === c).length,
        active: state.covs.has(c),
        dot: `var(--konvu-${c})`,
      })
    ).join("");
    out.push(`<div class="rail-section"><span class="section-label">Control coverage</span>${covRows}</div>`);

    if (PROPS.length) {
      const propRows = PROPS.map((prop) =>
        railRow({
          group: "props",
          value: prop,
          label: propertyLabel(prop),
          count: scoped.filter((r) => r.props.indexOf(prop) !== -1).length,
          active: state.props.has(prop),
          dot: `var(--konvu-prop-${prop}, var(--konvu-prop-default))`,
        })
      ).join("");
      out.push(`<div class="rail-section"><span class="section-label">Security property</span>${propRows}</div>`);
    }
  }

  document.getElementById("rail").innerHTML = out.join("");
}

function searchPlaceholder() {
  if (state.view === "controls") return "Control or property…";
  if (state.view === "urls") return "Path or module…";
  return "URL, name, file…";
}

/* --- tables ----------------------------------------------------------------
 * The product does not render one generic asset table: each asset type has its
 * own columns, because what you need to know about an endpoint group is not
 * what you need to know about a data object. InventoryAssetTables.tsx defines
 * three, and these mirror them column for column.
 *
 * Note what is absent. There is no "Kind" column: the rail already scopes to
 * one kind, so a column repeating it on every row says nothing. There is no
 * "Declared at" column either; the declaration is the sub-line under the name
 * where the product puts it, and in full in the panel.
 */

/** Every table is described this way, then rendered by one engine. */
function tableSpec() {
  const v = state.view;

  if (v === "endpoint") {
    return {
      itemLabel: "endpoint groups",
      defaultSort: { key: "coverage", dir: -1 },
      columns: [
        {
          key: "endpoint", label: "Endpoint group", width: "auto",
          value: (r) => (r.asset.name || "").toLowerCase(),
          cell: (r) =>
            `<div class="cell-name cap">${esc(r.asset.name)}</div>` +
            (r.asset.ambiguous ? `<div style="margin-top:3px">${chip("ambiguous", "ambiguous")}</div>` : "") +
            routePreview(r.urls, (r.asset.routes && r.asset.routes[0] && r.asset.routes[0].method) || "route"),
        },
        {
          key: "routes", label: "Endpoints", width: "110px",
          value: (r) => r.urls.length,
          cell: (r) => `<span class="num">${r.urls.length}</span>`,
        },
        {
          key: "coverage", label: "Control coverage", width: "220px",
          value: (r) => byGaps(r.counts),
          cell: (r) => ((r.asset.controls || []).length ? coverageSummary(r.counts, r.asset.name) : presenceTag("none")),
        },
      ],
    };
  }

  if (v === "object") {
    return {
      itemLabel: "data objects",
      defaultSort: { key: "coverage", dir: -1 },
      columns: [
        {
          key: "model", label: "Data object", width: "auto",
          value: (r) => (r.group.model.name || "").toLowerCase(),
          cell: (r) =>
            `<div class="cell-name">${esc(r.group.model.name)}</div>` +
            (r.group.model.ambiguous ? `<div style="margin-top:3px">${chip("ambiguous", "ambiguous")}</div>` : "") +
            `<div class="cell-sub" title="${esc(r.group.model.decl || "")}">${esc(r.group.model.decl || "")}</div>`,
        },
        {
          key: "fields", label: "Fields", width: "170px",
          value: (r) => r.group.fields.length,
          cell: (r) =>
            `<span class="num">${r.group.fields.length}</span>` +
            `<div class="cell-note">${r.group.classifiedFields.length} carrying controls</div>`,
        },
        {
          key: "versions", label: "Version tables", width: "140px",
          value: (r) => r.group.versionTables.length,
          cell: (r) =>
            r.group.versionTables.length
              ? `<span class="num" title="${esc(r.group.versionTables.map((t) => t.name).join(", "))}">${r.group.versionTables.length}</span>`
              : `<span class="dash">—</span>`,
        },
        {
          key: "coverage", label: "Control coverage", width: "220px",
          value: (r) => byGaps(r.counts),
          cell: (r) => (r.counts.total ? coverageSummary(r.counts, r.group.model.name) : presenceTag("none")),
        },
      ],
    };
  }

  if (v === "code") {
    return {
      itemLabel: "code assets",
      defaultSort: { key: "coverage", dir: -1 },
      columns: [
        {
          key: "code", label: "Code asset", width: "auto",
          value: (r) => (r.asset.name || "").toLowerCase(),
          cell: (r) =>
            `<div class="cell-name">${esc(r.asset.name)}</div>` +
            (r.asset.ambiguous ? `<div style="margin-top:3px">${chip("ambiguous", "ambiguous")}</div>` : "") +
            `<div class="cell-sub" title="${esc(r.asset.decl || "")}">${esc(r.asset.decl || "")}</div>`,
        },
        {
          key: "coverage", label: "Control coverage", width: "220px",
          value: (r) => byGaps(r.counts),
          cell: (r) => ((r.asset.controls || []).length ? coverageSummary(r.counts, r.asset.name) : presenceTag("none")),
        },
      ],
    };
  }

  if (v === "controls") {
    return {
      itemLabel: "controls",
      // Partial first: the product sorts status ascending so the weakest reads
      // at the top.
      defaultSort: { key: "status", dir: 1 },
      columns: [
        {
          key: "control", label: "Control", width: "auto",
          value: (r) => (r.c.name || r.c.id).toLowerCase(),
          cell: (r) =>
            `<div class="cell-name">${esc(r.c.name || r.c.id)}</div>` +
            `<div class="cell-sub" title="${esc(r.c.id)}">${esc(r.c.id)}</div>`,
        },
        {
          key: "property", label: "Property", width: "150px",
          value: (r) => PROPERTY_ORDER.indexOf(r.c.property),
          // Plain gray text, not an accent: the accent belongs to a control
          // card, not to a cell in a list.
          cell: (r) => `<span class="plain-prop">${esc(propertyLabel(r.c.property))}</span>`,
        },
        {
          key: "status", label: "Status", width: "120px",
          value: (r) => (r.presence === "partial" ? 0 : 1),
          cell: (r) => presenceTag(r.presence),
        },
        {
          key: "protects", label: "Protects", width: "140px",
          value: (r) => r.links.length,
          cell: (r) =>
            `<span class="num">${r.links.length}</span>` +
            `<span class="unit">${r.links.length === 1 ? "asset" : "assets"}</span>`,
        },
      ],
    };
  }

  return {
    itemLabel: "routes",
    defaultSort: { key: "path", dir: 1 },
    columns: [
      {
        key: "method", label: "Method", width: "90px",
        value: (r) => r.route.method || "",
        cell: (r) => `<span class="method">${esc(r.route.method || "—")}</span>`,
      },
      {
        key: "path", label: "Path", width: "auto",
        value: (r) => r.route.path || "",
        cell: (r) => `<span class="mono" style="color:var(--konvu-ink)">${esc(r.route.path)}</span>`,
      },
      {
        key: "module", label: "Declared in", width: "200px",
        value: (r) => r.route.module || "",
        cell: (r) => `<span class="cell-sub" style="margin:0">${esc(r.route.module)}:${esc(r.route.line)}</span>`,
      },
      {
        key: "attributed", label: "Attributed to", width: "270px",
        value: (r) => r.owners.length,
        cell: (r) => r.ownerCells,
      },
    ],
  };
}

const PROPERTY_ORDER = [
  "authorization",
  "authentication",
  "confidentiality",
  "integrity",
  "availability",
  "non_repudiation",
];

/** The rows for the current view, before search, filters and sorting. */
function baseRows() {
  const v = state.view;

  if (v === "object") {
    return dataObjectGroups().map((group) => {
      const statuses = [
        ...(group.model.controls || []).map((l) => l.status),
        ...group.fields.flatMap((f) => (f.controls || []).map((l) => l.status)),
      ];
      const props = new Set();
      for (const a of [group.model, ...group.fields]) {
        for (const l of a.controls || []) {
          const c = controlById.get(l.control_id);
          if (c && c.property) props.add(c.property);
        }
      }
      return {
        id: group.model.id,
        group,
        counts: coverageOf(statuses),
        cov: statuses.length ? worstOf(statuses) : "none",
        props: Array.from(props),
        haystack: [
          group.model.name, group.model.decl, group.model.description,
          group.fields.map((f) => f.name).join(" "),
          group.versionTables.map((t) => t.name).join(" "),
        ].join(" ").toLowerCase(),
      };
    });
  }

  if (v === "controls") {
    return implementedControls().map((c) => {
      const links = [];
      for (const a of ASSETS) {
        for (const l of a.controls || []) if (l.control_id === c.id) links.push({ asset: a, link: l });
      }
      const statuses = links.map(({ link }) => link.status);
      return {
        id: c.id,
        c,
        links,
        presence: statuses.length ? worstOf(statuses) : "absent",
        counts: coverageOf(statuses),
        haystack: [c.name, c.id, c.description, c.property].join(" ").toLowerCase(),
      };
    });
  }

  if (v === "urls") {
    return ROUTES.map((route) => {
      const owners = ROUTE_INDEX.byRoute.get(route.id) || [];
      const seen = new Set();
      const all = [];
      for (const o of owners) {
        if (seen.has(o.assetId)) continue;
        seen.add(o.assetId);
        const a = ASSETS.find((x) => x.id === o.assetId);
        if (a) all.push({ name: a.name, broad: o.broad });
      }
      all.sort((x, y) => Number(x.broad) - Number(y.broad));
      const shown = all.slice(0, 2);
      let cells = shown
        .map(
          (o) =>
            `<span class="urlpill${o.broad ? " broad" : ""}" title="${esc(o.broad ? "Reached only through a catch-all token — not treated as coverage" : "Resolved from a specific token")}">${esc(o.name)}</span>`
        )
        .join("");
      if (all.length > shown.length) {
        cells += `<span class="more" title="${esc(all.slice(2).map((o) => o.name).join(", "))}">+${all.length - shown.length}</span>`;
      }
      if (!all.length) cells = `<span class="chip">unattributed</span>`;
      return {
        id: route.id,
        route,
        owners: all,
        ownerCells: cells,
        haystack: [route.path, route.module, route.method, all.map((o) => o.name).join(" ")].join(" ").toLowerCase(),
      };
    });
  }

  const kind = currentKind();
  return VIEW_ROWS.filter((r) => r.asset.kind === kind).map((r) => ({ ...r, id: r.asset.id }));
}

function worstOf(statuses) {
  let worst = "present";
  for (const st of statuses) {
    const v = RANK[st] === undefined ? "partial" : st;
    if (RANK[v] < RANK[worst]) worst = v;
  }
  return worst;
}

/**
 * `implementedControls` — controls with at least one implementation in the
 * code. A control nothing implements is an expectation the code fails, which is
 * a finding rather than an asset, so the product deliberately omits it here.
 * The count is surfaced in the caveats instead of being silently dropped.
 */
function implementationsFor(control) {
  const obs = new Set(control.source_control_observation_ids || []);
  if (!obs.size) return [];
  return IMPLS.filter((i) => (i.source_control_observation_ids || []).some((id) => obs.has(id)));
}

function implementedControls() {
  return CONTROLS.filter((c) => implementationsFor(c).length > 0).sort((a, b) => {
    const byProp = PROPERTY_ORDER.indexOf(a.property) - PROPERTY_ORDER.indexOf(b.property);
    return byProp !== 0 ? byProp : (a.name || "").localeCompare(b.name || "");
  });
}

function unimplementedControls() {
  return CONTROLS.filter((c) => implementationsFor(c).length === 0);
}

/** Search, facet filters and sorting, applied to whatever baseRows() gave. */
function filtered() {
  const spec = tableSpec();
  const q = state.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];

  let rows = baseRows().filter((r) => {
    if (isAssetView()) {
      if (state.covs.size && !state.covs.has(r.cov)) return false;
      if (state.props.size && !(r.props || []).some((p) => state.props.has(p))) return false;
    }
    for (const t of terms) if (r.haystack.indexOf(t) === -1) return false;
    return true;
  });

  const sort = state.sort.key ? state.sort : spec.defaultSort;
  const col = spec.columns.find((c) => c.key === sort.key) || spec.columns[0];
  rows.sort((x, y) => {
    const a = col.value(x), b = col.value(y);
    if (a < b) return -1 * sort.dir;
    if (a > b) return 1 * sort.dir;
    return 0;
  });
  return { rows, spec, sort };
}

function renderTable() {
  const { rows, spec, sort } = filtered();
  const total = baseRows().length;

  document.getElementById("thead").innerHTML =
    "<tr>" +
    spec.columns
      .map((c) => {
        const active = sort.key === c.key;
        const arrow = active ? `<span class="arrow">${sort.dir > 0 ? "↑" : "↓"}</span>` : "";
        const w = c.width === "auto" ? "" : ` style="width:${c.width}"`;
        return `<th data-key="${c.key}"${w}>${esc(c.label)}${arrow}</th>`;
      })
      .join("") +
    "</tr>";

  document.getElementById("foot-count").textContent = `${rows.length} of ${total} ${spec.itemLabel}`;

  const empty = document.getElementById("empty");
  const tbody = document.getElementById("tbody");

  if (!rows.length) {
    tbody.innerHTML = "";
    empty.style.display = "";
    empty.innerHTML =
      `<h4>Nothing matches</h4><p>No ${esc(spec.itemLabel)} match these filters. ` +
      `If you searched a URL, it may be covered by a group pattern rather than named directly &mdash; ` +
      `the <b>URLs</b> view resolves patterns to concrete routes.</p>`;
    return;
  }
  empty.style.display = "none";

  tbody.innerHTML = rows
    .map(
      (r, i) =>
        `<tr data-i="${i}" data-id="${esc(r.id)}" tabindex="-1" aria-selected="${state.selected === r.id}">` +
        spec.columns.map((c) => `<td class="col-${c.key}">${c.cell(r)}</td>`).join("") +
        `</tr>`
    )
    .join("");
}

/* ------------------------------------------------------------ side panel -- */

function openAsset(id) {
  const row = VIEW_ROWS.find((r) => r.asset.id === id);
  if (!row) return;
  const a = row.asset;
  state.selected = id;

  document.getElementById("panel-title").textContent = a.name;
  document.getElementById("panel-chips").innerHTML =
    kindCell(a.kind) + presenceTag(row.cov) +
    (a.ambiguous ? chip("ambiguous", "ambiguous") : "");

  const parts = [];

  if (a.description) {
    parts.push(section("What it is", `<div class="hair"><p class="prose">${esc(a.description)}</p></div>`));
  }

  const kv = [];
  if (a.decl) kv.push(["Declared at", a.decl]);
  if (a.must_list_at) kv.push(["Listed at", a.must_list_at]);
  if (a.origin) kv.push(["Origin", a.origin]);
  if (a.parent) kv.push(["Parent", a.parent]);
  if ((a.paths || []).length) kv.push(["Files", a.paths.join(", ")]);
  kv.push(["Asset id", a.id]);
  parts.push(
    section(
      "Identity",
      `<div class="hair"><dl class="kv">` +
        kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("") +
        `</dl></div>`
    )
  );

  if (a.quote) {
    parts.push(section("Source", `<pre class="quote">${esc(a.quote)}</pre>`));
  }

  const urls = row.urls, broad = assetBroadUrls(a);
  if (urls.length || broad.length) {
    parts.push(
      section(
        "Endpoints",
        urls.map((u) => `<span class="urlpill">${esc(u)}</span>`).join("") +
          broad.map((u) => `<span class="urlpill broad" title="Reached only through a catch-all token">${esc(u)}</span>`).join("") +
          (broad.length
            ? `<p class="inline-note">Dashed URLs are reached only through a catch-all pattern in this asset's token list. ` +
              `The baseline does not claim this asset covers them.</p>`
            : ""),
        urls.length + broad.length
      )
    );
  }

  if ((a.tokens || []).length) {
    parts.push(
      section(
        "Match patterns",
        `<ul class="plain">` +
          a.tokens.map((t) => `<li>${esc(t)}</li>`).join("") +
          `</ul><p class="inline-note">The literal patterns the engine matched to identify this asset. ` +
          `The schema does not rank them, so a precise pattern and a catch-all are indistinguishable here.</p>`,
        a.tokens.length
      )
    );
  }

  const links = a.controls || [];
  if (links.length) {
    parts.push(
      section("Controls", links.map((l) => {
        const c = controlById.get(l.control_id) || {};
        const ev = (l.evidence || [])
          .map((e) =>
            (e.decl ? `<div class="decl">${esc(e.decl)}</div>` : "") +
            (e.quote ? `<pre class="quote">${esc(e.quote)}</pre>` : "")
          ).join("");
        const checked = (l.checked || []).length
          ? `<ul class="checked">${l.checked.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`
          : "";
        const impls = (l.implementation_ids || [])
          .map((id) => {
            const im = implById.get(id);
            return im ? `<span class="urlpill">${esc(im.name || id)}</span>` : "";
          }).join("");
        return (
          `<div class="card" data-property="${esc(c.property || "")}"><div class="card-head">` +
          `<span class="title">${esc(c.name || l.control_id)}</span>` +
          presenceTag(RANK[l.status] === undefined ? "none" : l.status) +
          (c.property ? `<span class="prop">${esc(propertyLabel(c.property))}</span>` : "") +
          `</div><div class="card-body">` +
          (l.description ? `<p class="prose">${esc(l.description)}</p>` : "") +
          ev +
          (checked ? `<p class="inline-note" style="margin-top:9px"><b>Inspected:</b></p>${checked}` : "") +
          (impls ? `<div style="margin-top:8px">${impls}</div>` : "") +
          `</div></div>`
        );
      }).join(""), links.length)
    );
  } else {
    parts.push(
      section(
        "Controls",
        `<div class="hair"><p class="prose">The mapping linked no control to this asset.</p>` +
          `<p class="inline-note">This records an absence of attribution, not an absence of protection. ` +
          `A control may exist in the codebase without the engine connecting it here.</p></div>`
      )
    );
  }

  document.getElementById("panel-body").innerHTML = parts.join("");
  document.getElementById("panel").classList.add("open");
  markSelected();
}

/** Route a row to its panel: controls have their own, everything else is an asset. */
function openRow(id) {
  if (state.view === "controls") return openControl(id);
  if (state.view === "urls") return;
  openAsset(id);
}

/* Highlight the open row without re-rendering the table: a full render at 600
 * rows throws away scroll position and the row you just clicked jumps away. */
function markSelected() {
  for (const tr of document.querySelectorAll("tbody tr")) {
    const id = tr.dataset.id || tr.dataset.control;
    if (id && id === state.selected) tr.setAttribute("aria-selected", "true");
    else tr.removeAttribute("aria-selected");
  }
}

function openControl(id) {
  const c = controlById.get(id);
  if (!c) return;
  state.selected = id;
  document.getElementById("panel-title").textContent = c.name || c.id;
  document.getElementById("panel-chips").innerHTML =
    (c.property ? `<span class="chip">${esc(propertyLabel(c.property))}</span>` : "");

  const covered = [];
  for (const a of ASSETS) {
    for (const l of a.controls || []) {
      if (l.control_id === c.id) covered.push({ a, l });
    }
  }
  const obs = OBS_CONTROLS.filter((o) => (c.source_control_observation_ids || []).indexOf(o.id) !== -1);

  const prop = esc(c.property || "");
  const parts = [];
  if (c.description) {
    parts.push(section("What it is", `<div class="hair"><p class="prose">${esc(c.description)}</p></div>`));
  }

  parts.push(
    section(
      "Observed implementations",
      obs.length
        ? obs.map((o) =>
            `<div class="card" data-property="${prop}"><div class="card-head">` +
            `<span class="title">${esc(o.id.replace(/^control-observation:/, ""))}</span>` +
            presenceTag(RANK[o.status] === undefined ? "none" : o.status) +
            `</div><div class="card-body">` +
            (o.description ? `<p class="prose">${esc(o.description)}</p>` : "") +
            (o.decl ? `<div class="decl">${esc(o.decl)}</div>` : "") +
            (o.quote ? `<pre class="quote">${esc(o.quote)}</pre>` : "") +
            ((o.checked || []).length
              ? `<p class="inline-note" style="margin-top:9px"><b>Inspected:</b></p>` +
                `<ul class="checked">${o.checked.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`
              : "") +
            `</div></div>`
          ).join("")
        : `<div class="hair"><p class="prose">No observation recorded.</p></div>`,
      obs.length
    )
  );

  parts.push(
    section(
      "Assets linked",
      covered.length
        ? covered.map(({ a, l }) =>
            `<div class="card" data-property="${prop}"><div class="card-head">` +
            `<span class="title">${esc(a.name)}</span>` +
            presenceTag(RANK[l.status] === undefined ? "none" : l.status) +
            `</div><div class="card-body">` +
            kindCell(a.kind) +
            `<div class="decl" style="margin-top:6px">${esc(a.decl || "")}</div></div></div>`
          ).join("")
        : `<div class="hair"><p class="prose">No asset links this control.</p></div>`,
      covered.length
    )
  );

  document.getElementById("panel-body").innerHTML = parts.join("");
  document.getElementById("panel").classList.add("open");
  markSelected();
}

function closePanel() {
  document.getElementById("panel").classList.remove("open");
  state.selected = null;
  markSelected();
}

/* ------------------------------------------------------------------ wire -- */

function render() {
  renderTable();
  document.getElementById("view-title").textContent = viewLabel();
}

function setView(v) {
  state.view = v;
  state.cursor = -1;
  state.covs.clear();
  state.props.clear();
  state.sort = { key: null, dir: 1 };
  closePanelSilently();
  renderRail();
  render();
}

function closePanelSilently() {
  document.getElementById("panel").classList.remove("open");
  state.selected = null;
}

/** The repository scope, shown beside the page title the way the product does. */
function renderScopeChip() {
  const cb = DATA.codebase || {};
  const vcs = cb.git || {};
  const bits = [];
  if (cb.name) bits.push(cb.name);
  if (vcs.short_commit || vcs.commit) {
    bits.push((vcs.branch ? vcs.branch + " @ " : "") + (vcs.short_commit || String(vcs.commit).slice(0, 8)));
  }
  document.getElementById("scope-chip").textContent = bits.join("  ·  ");
}

document.addEventListener("click", (e) => {
  const row = e.target.closest(".rrow");
  if (row) {
    if (row.dataset.nav) return setView(row.dataset.nav);
    const set = state[row.dataset.group];
    if (!set) return;
    const v = row.dataset.value;
    if (set.has(v)) set.delete(v); else set.add(v);
    renderRail();
    render();
    return;
  }

  if (e.target.closest("#panel-close")) return closePanel();

  const th = e.target.closest("thead th[data-key]");
  if (th) {
    const key = th.dataset.key;
    const current = state.sort.key ? state.sort : tableSpec().defaultSort;
    if (current.key === key) state.sort = { key, dir: current.dir * -1 };
    else state.sort = { key, dir: 1 };
    render();
    return;
  }

  const tr = e.target.closest("tbody tr");
  if (tr && tr.dataset.id) openRow(tr.dataset.id);
});

/* The rail re-renders, so the search box is bound by delegation rather than
 * by a handler on an element that gets replaced. */
document.addEventListener("input", (e) => {
  if (e.target.id !== "q") return;
  state.q = e.target.value;
  state.cursor = -1;
  render();
});

document.addEventListener("keydown", (e) => {
  const inField = e.target.tagName === "INPUT";
  if (e.key === "Escape") {
    if (inField) { e.target.blur(); return; }
    closePanel();
    return;
  }
  if (inField) return;

  if (e.key === "/") { e.preventDefault(); document.getElementById("q").focus(); return; }

  const rows = Array.from(document.querySelectorAll("tbody tr"));
  if (!rows.length) return;

  if (e.key === "j" || e.key === "ArrowDown") {
    e.preventDefault();
    state.cursor = Math.min(state.cursor + 1, rows.length - 1);
  } else if (e.key === "k" || e.key === "ArrowUp") {
    e.preventDefault();
    state.cursor = Math.max(state.cursor - 1, 0);
  } else if (e.key === "Enter") {
    const r = rows[state.cursor];
    if (r && r.dataset.id) openRow(r.dataset.id);
    return;
  } else return;

  for (const r of rows) r.removeAttribute("aria-selected");
  const cur = rows[state.cursor];
  if (cur) {
    cur.setAttribute("aria-selected", "true");
    cur.scrollIntoView({ block: "nearest" });
  }
});

/* ------------------------------------------------------------------ boot -- */

renderHeader();
renderScopeChip();
renderNotices();
/* Open on the densest asset type that has rows, so the first screen is never
 * an empty table just because this repository exposes no endpoints. */
const endpointsView = VIEWS.find((v) => v.value === "endpoint");
const firstView =
  viewCount(endpointsView) > 0
    ? endpointsView
    : VIEWS.filter((v) => v.kind && viewCount(v) > 0).sort((a, b) => viewCount(b) - viewCount(a))[0] ||
      VIEWS[0];
setView(firstView.value);
</script>
</body>
</html>
