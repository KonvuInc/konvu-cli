project_name: konvu
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: konvu
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/KonvuTeam/konvu-cli/cmd.Version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - skills/**/*
      - registry/**/*

brews:
  - repository:
      owner: KonvuTeam
      name: homebrew-tap
    homepage: "https://konvu.com"
    description: "Security vulnerability management from your terminal"
    license: "Proprietary"
    install: |
      bin.install "konvu"
      # Install bundled skills and registry alongside the binary.
      prefix.install "skills" if File.directory?("skills")
      prefix.install "registry" if File.directory?("registry")

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
